<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sky • Night View</title>

  <link rel="stylesheet" href="/sky/assets/sky.css">
</head>

<body>
  <div class="sky-page">
    <div class="sky-card" id="skyCard">
      <div class="sky-title">
        <div class="sky-h1">Sky • Night View</div>
      </div>

      <!-- top pills -->
      <div class="sky-topbar">
        <div class="sky-pill" id="locPill">📍 Location —</div>
        <div class="sky-pill" id="framePill">🛰 Frame —</div>
        <div class="sky-pill sky-pill-ok" id="dataPill">● Data</div>
      </div>

      <!-- stage (THIS goes fullscreen) -->
      <div class="sky-stage" id="skyStage">
        <div class="sky-mount" id="skyMount"></div>

        <!-- overlay buttons (inside stage) -->
        <div class="sky-stage-controls" id="stageControls">
          <button class="sky-btn sky-btn-icon" id="btnLayers" type="button" title="Layers">
            <svg viewBox="0 0 24 24" width="20" height="20"
            fill="none" stroke="currentColor" stroke-width="2" 
            stroke-linecap="round" stroke-linejoin="round"
            aria-hidden="true">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
          </button>

          <button class="sky-btn sky-btn-icon" id="btnFullscreen" type="button" title="Fullscreen">⤢</button>
        </div>

          <!-- tooltip -->
        <div class="sky-tooltip" id="skyTooltip" aria-hidden="true"></div>

        <!-- layers popover -->
        <div class="sky-popover" id="layersPanel" hidden>
          <div class="sky-popover-title">Layers</div>

          <label class="sky-check"><input type="checkbox" data-opt="showGridAz" checked> Az grid</label>
          <label class="sky-check"><input type="checkbox" data-opt="showGridEq" checked> Eq grid</label>
          <label class="sky-check"><input type="checkbox" data-opt="showMeridian" checked> Meridian</label>
          <label class="sky-check"><input type="checkbox" data-opt="showEquator" checked> Equator</label>
          <label class="sky-check"><input type="checkbox" data-opt="showEcliptic" checked> Ecliptic</label>
          <label class="sky-check"><input type="checkbox" data-opt="showMilkyWay" checked> Milky Way</label>
          <label class="sky-check"><input type="checkbox" data-opt="showConstellations" checked> Constellations</label>
          <label class="sky-check"><input type="checkbox" data-opt="showConstellationLabels" checked> Con labels</label>
          <label class="sky-check"><input type="checkbox" data-opt="showSunMoon" checked> Sun/Moon</label>
          <label class="sky-check"><input type="checkbox" data-opt="showPlanets" checked> Planets</label>
          <label class="sky-check"><input type="checkbox" data-opt="showObjects" checked> Objects</label>
          <label class="sky-check"><input type="checkbox" data-opt="showAlerts" checked> Alerts</label>
        </div>

        <!-- ✅ PLAYER AS OVERLAY INSIDE STAGE (compact, bottom-right) -->
        <div class="sky-player sky-player-overlay sky-player-compact" id="skyPlayer">
          <!-- row 1: controls -->
          <div class="sky-player-row sky-player-row1">
            <div class="sky-player-controls">
              <button class="sky-btn" id="tHome" type="button" title="Start">|◀</button>
              <button class="sky-btn" id="tPrev" type="button" title="Step back">◀◀</button>
              <button class="sky-btn sky-btn-primary" id="tPlay" type="button" title="Play">▶</button>
              <button class="sky-btn" id="tNext" type="button" title="Step forward">▶▶</button>
              <button class="sky-btn" id="tNow" type="button" title="Now">Now</button>
            </div>
          </div>

          <!-- row 2: step buttons -->
          <div class="sky-player-row sky-player-row2">
            <div class="sky-player-steps">
              <button class="sky-btn" data-step="1" type="button">1h</button>
              <button class="sky-btn" data-step="3" type="button">3h</button>
              <button class="sky-btn sky-btn-active" data-step="6" type="button">6h</button>
              <button class="sky-btn" data-step="12" type="button">12h</button>
            </div>
          </div>

          <!-- row 3: progress -->
          <input class="sky-slider" id="tSlider" type="range" min="0" max="100" value="50" />

          <!-- row 4: hint line -->
          <div class="sky-player-hint" id="playerHint">—</div>

          <!-- keep for JS compatibility (hidden in CSS for compact layout) -->
          <span class="sky-player-time" id="playerTime">—</span>
        </div>
      </div>
    </div>
  </div>

<script>
  // ✅ MUST exist before widget.js is imported
    window.SKY_CONFIG = {
      baseUrl: "/sky",
      mountId: "skyMount",
      lat: 52.2297,
      lon: 21.0122,
      datetimeISO: null
    };
    console.log("[sky] SKY_CONFIG:", window.SKY_CONFIG);
  </script>

  <script type="module">
    import "./core/sky.ui.js";  // ✅ MUST be imported before widget.js
    import "./widget.js";
    import { bootSkyMapUI } from "./core/sky.map.js";
    bootSkyMapUI();
  </script>

</body>
</html>
