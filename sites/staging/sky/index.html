<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sky • Night View</title>

  <link rel="stylesheet" href="/sky/assets/sky.css">
</head>

<body>
  <div class="sky-page">
    <div class="sky-card" id="skyCard">
      <div class="sky-title">
        <div class="sky-h1">Sky • Night View</div>
      </div>

      <!-- top pills -->
      <div class="sky-topbar">
        <div class="sky-pill" id="locPill">📍 Location —</div>
        <div class="sky-pill" id="framePill">🛰 Frame —</div>
        <div class="sky-pill sky-pill-ok" id="dataPill">● Data</div>
      </div>

      <!-- stage (THIS goes fullscreen) -->
      <div class="sky-stage" id="skyStage">
        <div class="sky-mount" id="skyMount"></div>

        <!-- overlay buttons (inside stage) -->
        <div class="sky-stage-controls" id="stageControls">
          <button class="sky-btn sky-btn-icon" id="btnFullscreen" type="button" title="Fullscreen">⤢</button>
        </div>

        <!-- tooltip -->
        <div class="sky-tooltip" id="skyTooltip" aria-hidden="true"></div>

        <div class="sky-popover" id="bestPanel" hidden>
          <div class="sky-popover-title">Best tonight</div>
          <div class="sky-best-list" id="bestTodayList"></div>
        </div>

        <!-- ✅ PLAYER AS OVERLAY INSIDE STAGE (compact, bottom-right) -->
        <div class="sky-player sky-player-overlay sky-player-compact" id="skyPlayer">
          <!-- row 1: controls -->
          <div class="sky-player-row sky-player-row1">
            <div class="sky-player-controls">
              <button class="sky-btn" id="tHome" type="button" title="Start">|◀</button>
              <button class="sky-btn" id="tPrev" type="button" title="Step back">◀◀</button>
              <button class="sky-btn sky-btn-primary" id="tPlay" type="button" title="Play">▶</button>
              <button class="sky-btn" id="tNext" type="button" title="Step forward">▶▶</button>
              <button class="sky-btn" id="tNow" type="button" title="Now">Now</button>
            </div>
          </div>

          <!-- row 3: progress -->
          <input class="sky-slider" id="tSlider" type="range" min="0" max="100" value="50" />

          <!-- row 4: hint line -->
          <div class="sky-player-hint" id="playerHint">—</div>

          <!-- keep for JS compatibility (hidden in CSS for compact layout) -->
          <span class="sky-player-time" id="playerTime">—</span>
        </div>
      </div>
    </div>
  </div>

<script>
  // ✅ MUST exist before widget.js is imported
  window.SKY_CONFIG = {
    baseUrl: "/sky",
    mountId: "skyMount",
    lat: 52.2297,
    lon: 21.0122,
    datetimeISO: null
  };
  console.log("[sky] SKY_CONFIG:", window.SKY_CONFIG);
</script>

<script type="module">
  import "./core/sky.ui.js";  // ✅ MUST be imported before widget.js
  import "./widget.js";
  import { bootSkyMapUI } from "./core/sky.map.js";
  bootSkyMapUI();
</script>

</body>
</html>
