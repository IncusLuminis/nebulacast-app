<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>POC • Astro Weather Locations</title>
  <style>
    :root{
      --bg:#0b0d12; --panel:#0f1115; --line:#2a2f3a; --text:#e6e6e6;
      --muted:#9aa3b2; --title:#e6f2ff;
      --good:#7dff9a; --mid:#ffd36b; --bad:#ff6b6b;
    }
    html,body{height:100%}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
    }
    .wrap{
      max-width:640px;
      margin:0 auto;
      padding:16px 12px 40px;
    }
    .card{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:14px;
      padding:14px;
    }
    h1{
      margin:0 0 4px;
      font-size:18px;
      color:var(--title);
    }
    .sub{
      font-size:13px;
      color:var(--muted);
      margin-bottom:12px;
    }
    .loc-header{
      font-size:13px;
      margin-bottom:10px;
    }
    .loc-header strong{color:var(--title);}
    .json-snippet{
      font-family:Menlo,Consolas,monospace;
      font-size:11px;
      white-space:pre;
      background:#05060a;
      border-radius:8px;
      padding:10px;
      border:1px solid var(--line);
      overflow-x:auto;
      max-height:260px;
    }
    .error{
      color:var(--bad);
      font-size:13px;
      margin-top:8px;
    }
    .loc-select-row{
      display:flex;
      align-items:center;
      gap:8px;
      margin-bottom:10px;
      font-size:13px;
    }
    select, input{
      font-size:13px;
      padding:4px 8px;
      border-radius:999px;
      border:1px solid var(--line);
      background:#05060a;
      color:var(--text);
    }
    button{
      font-size:12px;
      padding:4px 10px;
      border-radius:999px;
      border:1px solid var(--line);
      background:rgba(143,182,255,.1);
      color:var(--text);
      cursor:pointer;
    }
    button:hover{
      background:rgba(143,182,255,.2);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Astro Weather • POC locations</h1>
      <div class="sub">
        POC page testing <code>/api/astro-weather</code> Cloudflare Pages Function.
      </div>

      <div class="loc-select-row">
        <span>Location:</span>
        <select id="locSelect"></select>
        <span style="margin-left:12px;">or</span>
        <input type="number" step="0.0001" placeholder="Lat" id="latInput" style="width:80px;">
        <input type="number" step="0.0001" placeholder="Lon" id="lonInput" style="width:80px;">
        <input type="text" placeholder="TZ" id="tzInput" style="width:120px;" value="Europe/Warsaw">
        <button type="button" id="fetchBtn">Fetch</button>
      </div>

      <div id="locHeader" class="loc-header">Loading…</div>
      <div id="jsonSnippet" class="json-snippet">Loading JSON…</div>
      <div id="errorBox" class="error" style="display:none"></div>
    </div>
  </div>

  <script>
    (function(){
      "use strict";

      const LS_KEY = "astro_poc_loc_id_v1";
      const API_BASE = ""; // same origin
      const API_URL = API_BASE + "/api/astro-weather";
      const INDEX_URL = API_BASE + "/data/weather/locations.json";

      const selectEl = document.getElementById("locSelect");
      const latInput = document.getElementById("latInput");
      const lonInput = document.getElementById("lonInput");
      const tzInput = document.getElementById("tzInput");
      const fetchBtn = document.getElementById("fetchBtn");
      const headerEl = document.getElementById("locHeader");
      const jsonEl = document.getElementById("jsonSnippet");
      const errEl = document.getElementById("errorBox");

      function showError(msg){
        errEl.textContent = msg;
        errEl.style.display = "block";
      }
      function clearError(){
        errEl.textContent = "";
        errEl.style.display = "none";
      }

      function loadStoredId(){
        try{
          return localStorage.getItem(LS_KEY) || null;
        }catch(e){ return null; }
      }
      function saveId(id){
        try{ localStorage.setItem(LS_KEY, id); }catch(e){}
      }

      async function loadIndex(){
        clearError();
        jsonEl.textContent = "Loading locations index…";
        try{
          const res = await fetch(INDEX_URL + "?ts=" + Date.now());
          if(!res.ok) throw new Error("HTTP " + res.status);
          const idx = await res.json();
          const locs = Array.isArray(idx.locations) ? idx.locations : [];
          if(!locs.length){
            throw new Error("No locations in index");
          }
          while(selectEl.firstChild) selectEl.removeChild(selectEl.firstChild);
          const storedId = loadStoredId();
          let currentId = storedId || idx.default_id || locs[0].id;
          locs.forEach(loc=>{
            const opt = document.createElement("option");
            opt.value = loc.id;
            opt.textContent = loc.name || loc.id;
            selectEl.appendChild(opt);
          });
          if(currentId) selectEl.value = currentId;
          selectEl.addEventListener("change", ()=>{
            const id = selectEl.value;
            if(id){
              saveId(id);
              loadLoc(id, locs);
            }
          });
          fetchBtn.addEventListener("click", ()=>{
            const lat = parseFloat(latInput.value);
            const lon = parseFloat(lonInput.value);
            const tz = tzInput.value.trim() || "Europe/Warsaw";
            if(isNaN(lat) || isNaN(lon)){
              showError("Invalid lat/lon");
              return;
            }
            fetchAstroWeather(lat, lon, tz);
          });
          if(currentId) loadLoc(currentId, locs);
        }catch(e){
          jsonEl.textContent = "—";
          showError("Failed to load locations index: " + (e.message || e));
        }
      }

      async function fetchAstroWeather(lat, lon, tz, profile = "default", hours = 72){
        clearError();
        jsonEl.textContent = "Fetching from /api/astro-weather…";
        try{
          const params = new URLSearchParams({
            lat: String(lat),
            lon: String(lon),
            tz: tz || "Europe/Warsaw",
            hours: String(hours),
            profile: profile,
          });
          const url = API_URL + "?" + params.toString();
          const res = await fetch(url);
          if(!res.ok){
            const text = await res.text();
            throw new Error("HTTP " + res.status + ": " + text.substring(0, 100));
          }
          const data = await res.json();
          headerEl.innerHTML =
            "📍 <strong>" + (data.location.name || "Location") + "</strong> " +
            "(" + data.location.lat.toFixed(4) + ", " + data.location.lon.toFixed(4) + ") · " +
            data.location.tz + " · Profile: " + data.profile;
          const preview = {
            generated_at: data.generated_at,
            location: data.location,
            horizon_hours: data.horizon_hours,
            profile: data.profile,
            derived: data.derived,
            hours_preview: Array.isArray(data.hours) ? data.hours.slice(0, 3).map(h => ({
              time: h.time,
              cloud_total: h.cloud_total,
              wind_m_s: h.wind_m_s,
              temp_c: h.temp_c,
              score: h.score,
              score_breakdown: h.score_breakdown,
            })) : []
          };
          jsonEl.textContent = JSON.stringify(preview, null, 2);
        }catch(e){
          jsonEl.textContent = "—";
          showError("API error: " + (e.message || e));
        }
      }

      async function loadLoc(id, locs){
        const loc = (locs || []).find(l=>l.id===id) || locs[0];
        if(!loc){
          headerEl.textContent = "No location";
          jsonEl.textContent = "—";
          return;
        }
        await fetchAstroWeather(loc.lat, loc.lon, loc.tz || "Europe/Warsaw");
      }

      if(document.readyState === "loading"){
        document.addEventListener("DOMContentLoaded", loadIndex);
      }else{
        loadIndex();
      }
    })();
  </script>
</body>
</html>
