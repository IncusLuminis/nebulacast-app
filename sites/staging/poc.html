<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>POC • Astro Weather Locations</title>
  <style>
    :root{
      --bg:#0b0d12; --panel:#0f1115; --line:#2a2f3a; --text:#e6e6e6;
      --muted:#9aa3b2; --title:#e6f2ff;
      --good:#7dff9a; --mid:#ffd36b; --bad:#ff6b6b;
    }
    html,body{height:100%}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
    }
    .wrap{
      max-width:640px;
      margin:0 auto;
      padding:16px 12px 40px;
    }
    .card{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:14px;
      padding:14px;
    }
    h1{
      margin:0 0 4px;
      font-size:18px;
      color:var(--title);
    }
    .sub{
      font-size:13px;
      color:var(--muted);
      margin-bottom:12px;
    }
    .loc-header{
      font-size:13px;
      margin-bottom:10px;
    }
    .loc-header strong{color:var(--title);}
    .json-snippet{
      font-family:Menlo,Consolas,monospace;
      font-size:11px;
      white-space:pre;
      background:#05060a;
      border-radius:8px;
      padding:10px;
      border:1px solid var(--line);
      overflow-x:auto;
      max-height:260px;
    }
    .error{
      color:var(--bad);
      font-size:13px;
      margin-top:8px;
    }

    /* Location bar */
    .loc-bar{
      display:flex;
      align-items:center;
      gap:8px;
      margin-bottom:12px;
      font-size:12px;
    }
    .loc-bar-label{
      color:var(--muted);
      font-size:11px;
      flex-shrink:0;
    }
    .loc-pill{
      flex:1;
      min-width:0;
      display:flex;
      align-items:center;
      gap:6px;
      padding:6px 10px;
      border-radius:999px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.02);
      color:var(--text);
      cursor:pointer;
      transition:background 0.2s;
    }
    .loc-pill:hover{
      background:rgba(255,255,255,.05);
    }
    .loc-pill-name{
      font-weight:600;
      color:var(--title);
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .loc-pill-coords{
      color:var(--muted);
      font-size:11px;
      flex-shrink:0;
    }
    .loc-change-btn{
      font-size:11px;
      padding:6px 12px;
      border-radius:999px;
      border:1px solid var(--line);
      background:rgba(143,182,255,.1);
      color:var(--text);
      cursor:pointer;
      flex-shrink:0;
      transition:background 0.2s;
    }
    .loc-change-btn:hover{
      background:rgba(143,182,255,.2);
    }

    /* Location panel */
    .loc-panel{
      display:none;
      margin-top:8px;
      padding:12px;
      background:rgba(255,255,255,.02);
      border:1px solid var(--line);
      border-radius:10px;
    }
    .loc-panel.open{
      display:block;
    }
    .loc-panel-error{
      padding:8px 10px;
      margin-bottom:10px;
      background:rgba(255,107,107,.1);
      border:1px solid var(--bad);
      border-radius:6px;
      color:var(--bad);
      font-size:12px;
    }
    .loc-panel-section{
      margin-bottom:12px;
    }
    .loc-panel-section:last-child{
      margin-bottom:0;
    }
    .loc-panel-label{
      display:block;
      font-size:11px;
      color:var(--muted);
      margin-bottom:6px;
      text-transform:uppercase;
      letter-spacing:0.5px;
    }
    .loc-input-dark, .loc-select-dark{
      width:100%;
      font-size:13px;
      padding:8px 10px;
      border-radius:8px;
      border:1px solid var(--line);
      background:var(--panel);
      color:var(--text);
      font-family:inherit;
    }
    .loc-input-dark:focus, .loc-select-dark:focus{
      outline:2px solid rgba(143,182,255,.4);
      outline-offset:1px;
    }
    .loc-input-dark::placeholder{
      color:var(--muted);
    }
    .loc-search-suggestions{
      position:absolute;
      z-index:100;
      width:100%;
      max-width:calc(100% - 24px);
      margin-top:4px;
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:8px;
      box-shadow:0 4px 12px rgba(0,0,0,.3);
      max-height:200px;
      overflow-y:auto;
      display:none;
    }
    .loc-search-suggestions.show{
      display:block;
    }
    .loc-search-suggestion{
      padding:8px 12px;
      cursor:pointer;
      border-bottom:1px solid var(--line);
      font-size:13px;
    }
    .loc-search-suggestion:last-child{
      border-bottom:none;
    }
    .loc-search-suggestion:hover{
      background:rgba(255,255,255,.05);
    }
    .loc-search-suggestion-name{
      color:var(--title);
      font-weight:500;
    }
    .loc-search-suggestion-details{
      font-size:11px;
      color:var(--muted);
      margin-top:2px;
    }
    .loc-geo-btn{
      width:100%;
      padding:8px 12px;
      border-radius:8px;
      border:1px solid var(--line);
      background:rgba(143,182,255,.1);
      color:var(--text);
      cursor:pointer;
      font-size:13px;
      transition:background 0.2s;
    }
    .loc-geo-btn:hover{
      background:rgba(143,182,255,.2);
    }
    .loc-geo-btn:disabled{
      opacity:0.5;
      cursor:not-allowed;
    }
    .loc-geo-error{
      margin-top:6px;
      font-size:11px;
      color:var(--bad);
    }
    .loc-advanced-toggle{
      font-size:11px;
      color:var(--muted);
      cursor:pointer;
      margin-top:8px;
      display:inline-block;
    }
    .loc-advanced-toggle:hover{
      color:var(--text);
    }
    .loc-advanced{
      display:none;
      margin-top:10px;
      padding-top:10px;
      border-top:1px solid var(--line);
    }
    .loc-advanced.open{
      display:block;
    }
    .loc-advanced-hint{
      font-size:10px;
      color:var(--muted);
      margin-top:4px;
      font-style:italic;
    }
    .loc-actions{
      display:flex;
      gap:8px;
      margin-top:12px;
    }
    .loc-btn-primary{
      flex:1;
      padding:10px 16px;
      border-radius:8px;
      border:none;
      background:rgba(143,182,255,.2);
      color:var(--title);
      font-weight:600;
      cursor:pointer;
      font-size:13px;
      transition:background 0.2s;
    }
    .loc-btn-primary:hover:not(:disabled){
      background:rgba(143,182,255,.3);
    }
    .loc-btn-primary:disabled{
      opacity:0.5;
      cursor:not-allowed;
    }
    .loc-btn-secondary{
      padding:10px 16px;
      border-radius:8px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.02);
      color:var(--text);
      cursor:pointer;
      font-size:13px;
      transition:background 0.2s;
    }
    .loc-btn-secondary:hover{
      background:rgba(255,255,255,.05);
    }
    .loc-status{
      font-size:11px;
      color:var(--muted);
      margin-top:6px;
    }
    .loc-status.fetching{
      color:var(--mid);
    }
    .loc-status.error{
      color:var(--bad);
    }

    /* Action bar: interactive controls only */
    .loc-action-bar{
      display:flex;
      align-items:center;
      gap:8px;
      margin-top:16px;
      margin-bottom:4px;
      flex-wrap:wrap;
    }
    .loc-action-label{
      font-size:14px;
      font-weight:500;
      color:var(--title);
      white-space:nowrap;
      flex-shrink:0;
    }
    .loc-input-wrapper{
      flex:1;
      position:relative;
      min-width:200px;
    }
    .loc-input{
      width:100%;
      padding:8px 12px;
      border-radius:8px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.03);
      color:var(--text);
      font-size:13px;
      font-family:inherit;
    }
    .loc-input:focus{
      outline:none;
      border-color:rgba(143,182,255,.4);
      background:rgba(255,255,255,.05);
    }
    .loc-btn-secondary{
      padding:8px 12px;
      border-radius:8px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.03);
      color:var(--text);
      cursor:pointer;
      font-size:13px;
      transition:background 0.2s;
      flex-shrink:0;
      white-space:nowrap;
    }
    .loc-btn-secondary:hover:not(:disabled){
      background:rgba(255,255,255,.08);
    }
    .loc-btn-secondary:disabled{
      opacity:0.5;
      cursor:not-allowed;
    }
    .loc-btn-icon{
      padding:8px 10px;
      border-radius:8px;
      border:none;
      background:transparent;
      color:var(--text);
      cursor:pointer;
      font-size:16px;
      line-height:1;
      transition:background 0.2s;
      flex-shrink:0;
      opacity:0.7;
    }
    .loc-btn-icon:hover{
      background:rgba(255,255,255,.05);
      opacity:1;
    }
    .loc-dd{
      position:absolute;
      top:100%;
      left:0;
      right:0;
      margin-top:4px;
      background:var(--bg);
      border:1px solid var(--line);
      border-radius:8px;
      max-height:200px;
      overflow-y:auto;
      z-index:100;
      display:none;
      box-shadow:0 4px 12px rgba(0,0,0,.3);
    }
    .loc-dd.show{
      display:block;
    }
    .loc-dd-item{
      padding:10px 12px;
      cursor:pointer;
      border-bottom:1px solid var(--line);
      font-size:13px;
    }
    .loc-dd-item:last-child{
      border-bottom:none;
    }
    .loc-dd-item:hover{
      background:rgba(255,255,255,.05);
    }
    .loc-dd-item-name{
      font-weight:500;
      color:var(--title);
    }
    .loc-dd-item-details{
      font-size:11px;
      color:var(--muted);
      margin-top:2px;
    }
    /* Status line: current context (non-interactive) */
    .loc-status-line{
      font-size:11px;
      color:var(--muted);
      margin-top:6px;
      margin-bottom:12px;
      padding:6px 10px;
      line-height:1.5;
      border:1px solid var(--line);
      border-radius:8px;
      background:rgba(255,255,255,.02);
    }
    .loc-status-content{
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
    }
    .loc-status-content span{
      white-space:nowrap;
    }
    .loc-status-api{
      display:inline-flex;
      align-items:center;
      gap:4px;
    }
    .loc-status-api.online::before{
      content:"●";
      color:var(--good);
      font-size:10px;
    }
    .loc-status-api.offline::before{
      content:"●";
      color:var(--mid);
      font-size:10px;
    }
    .loc-hint{
      font-size:11px;
      color:var(--mid);
      margin-top:4px;
      padding:6px 8px;
      background:rgba(255,255,0,.1);
      border-radius:4px;
    }
    .loc-hint.error{
      color:var(--bad);
      background:rgba(255,0,0,.1);
    }

    @media(min-width:560px){
      .loc-panel-section-row{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:12px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Astro Weather • POC locations</h1>
      <div class="sub">
        POC page testing <code>/api/astro-weather</code> Cloudflare Pages Function.
        <br><small style="opacity:0.7;">💡 For full functionality, run: <code>make server-api</code></small>
      </div>

      <!-- Action bar: interactive controls only -->
      <div class="loc-action-bar">
        <span class="loc-action-label">Location</span>
        <div class="loc-input-wrapper">
          <input type="text" class="loc-input" id="locInput" placeholder='City or "lat, lon"' autocomplete="off">
          <div class="loc-dd" id="locDropdown"></div>
        </div>
        <button type="button" class="loc-btn-secondary" id="locGeoBtn" title="Use my location">📍 My location</button>
        <button type="button" class="loc-btn-icon" id="locShareBtn" title="Share Location">🔗</button>
      </div>
      
      <!-- Status line: current context (non-interactive) -->
      <div class="loc-status-line" id="locStatusLine" style="display:none">
        <span class="loc-status-content" id="locStatusContent"></span>
      </div>
      <div id="locHint" class="loc-hint" style="display:none"></div>
      <div id="jsonSnippet" class="json-snippet">Loading JSON…</div>
      <div id="errorBox" class="error" style="display:none"></div>
    </div>
  </div>

  <script>
    (function(){
      "use strict";

      const LS_KEY = "nebulacast_location";
      const API_BASE = "";
      const API_ASTRO_WEATHER = API_BASE + "/api/astro-weather";
      const API_GEOCODE = API_BASE + "/api/geocode";
      const API_REVGEO = API_BASE + "/api/revgeo";
      const API_TIMEZONE = API_BASE + "/api/timezone";
      // Fallback for local dev (static JSON)
      const STATIC_LOCATIONS_INDEX = API_BASE + "/data/weather/locations.json";
      const STATIC_LOC_BASE = API_BASE + "/data/weather/loc";
      
      console.log("API_BASE:", API_BASE);
      console.log("STATIC_LOCATIONS_INDEX:", STATIC_LOCATIONS_INDEX);
      console.log("STATIC_LOC_BASE:", STATIC_LOC_BASE);

      const DEFAULT_LOCATION = {
        name: "Warsaw",
        lat: 52.2297,
        lon: 21.0122,
        tz: "Europe/Warsaw"
      };


      let state = {
        location: {...DEFAULT_LOCATION},
        fetching: false,
        error: null,
        apiAvailable: null,
        profile: "default",
        geoRequestId: null, // Track current geolocation request to prevent race conditions
        locationSource: "default" // Track source: "default", "manual", "search", "geolocation"
      };

      // Elements
      const locInput = document.getElementById("locInput");
      const locGeoBtn = document.getElementById("locGeoBtn");
      const locShareBtn = document.getElementById("locShareBtn");
      const locDropdown = document.getElementById("locDropdown");
      const locHint = document.getElementById("locHint");
      const locStatusLine = document.getElementById("locStatusLine");
      const locStatusContent = document.getElementById("locStatusContent");
      const jsonEl = document.getElementById("jsonSnippet");
      const errEl = document.getElementById("errorBox");

      let searchDebounceTimer = null;
      let geocodeAvailable = false;

      // Load saved location
      function loadSavedLocation(){
        try{
          const raw = localStorage.getItem(LS_KEY);
          if(!raw) return DEFAULT_LOCATION;
          const parsed = JSON.parse(raw);
          if(parsed && typeof parsed.lat === "number" && typeof parsed.lon === "number"){
            return {
              name: parsed.name || DEFAULT_LOCATION.name,
              lat: parsed.lat,
              lon: parsed.lon,
              tz: parsed.tz || DEFAULT_LOCATION.tz
            };
          }
        }catch(e){}
        return DEFAULT_LOCATION;
      }

      function saveLocation(loc){
        try{
          localStorage.setItem(LS_KEY, JSON.stringify(loc));
        }catch(e){}
      }

      // Helper: debounce function
      function debounce(fn, ms){
        let timer = null;
        return function(...args){
          if(timer) clearTimeout(timer);
          timer = setTimeout(() => fn.apply(this, args), ms);
        };
      }

      // Helper: parse coordinates from text input
      function parseCoords(text){
        if(!text || typeof text !== "string") return null;
        text = text.trim();
        
        // Try to extract two numbers (lat, lon)
        // Patterns: "50.087, 14.421" or "50.087 14.421" or "50.087° N, 0.1278° W"
        const patterns = [
          /(-?\d+\.?\d*)\s*[,\s]\s*(-?\d+\.?\d*)/,  // Basic: "50.087, 14.421" or "50.087 14.421"
          /(-?\d+\.?\d*)\s*°\s*[NS]?\s*[,\s]\s*(-?\d+\.?\d*)\s*°\s*[EW]?/i,  // With degrees: "50.087° N, 0.1278° W"
        ];
        
        for(const pattern of patterns){
          const match = text.match(pattern);
          if(match){
            let lat = parseFloat(match[1]);
            let lon = parseFloat(match[2]);
            
            // Handle N/S/E/W indicators
            const textUpper = text.toUpperCase();
            if(textUpper.includes("S") && lat > 0) lat = -lat;
            if(textUpper.includes("W") && lon > 0) lon = -lon;
            
            // Validate ranges
            if(!isNaN(lat) && !isNaN(lon) && lat >= -90 && lat <= 90 && lon >= -180 && lon <= 180){
              return {lat, lon};
            }
          }
        }
        return null;
      }

      // Helper: clamp coordinates
      function clampLatLon(lat, lon){
        return {
          lat: Math.max(-90, Math.min(90, lat)),
          lon: Math.max(-180, Math.min(180, lon))
        };
      }

      // Helper: format coordinates for display
      function formatCoord(lat, lon){
        return lat.toFixed(4) + ", " + lon.toFixed(4);
      }

      // Helper: escape HTML
      function escapeHtml(s){
        if(!s) return "";
        const div = document.createElement("div");
        div.textContent = s;
        return div.innerHTML;
      }

      // Update status line: location, coords, timezone, profile, API status
      async function updateStatusLine(){
        if(!locStatusLine || !locStatusContent) return;
        const loc = state.location;
        
        if(!loc || !loc.lat || !loc.lon){
          locStatusLine.style.display = "none";
          return;
        }
        
        // Get timezone display name (non-blocking - show IANA first, update if API responds)
        let tzDisplay = loc.tz || "UTC";
        const tzPromise = (async () => {
          try{
            const res = await fetch(API_TIMEZONE + "?lat=" + loc.lat + "&lon=" + loc.lon);
            if(res.ok){
              const tzData = await res.json();
              if(tzData.display){
                return tzData.display;
              }
            }
          }catch(e){
            // Use IANA timezone as fallback
          }
          return tzDisplay;
        })();
        
        // Get profile display name
        const profileNames = {
          "default": "Balanced",
          "balanced": "Balanced",
          "visual": "Visual",
          "photography": "Photography",
          "planetary": "Planetary"
        };
        const profileDisplay = profileNames[state.profile?.toLowerCase()] || "Balanced";
        
        // Format place name
        const placeName = loc.name && loc.name !== formatCoord(loc.lat, loc.lon) 
          ? loc.name 
          : formatCoord(loc.lat, loc.lon);
        
        // API status
        const apiStatusClass = state.apiAvailable === true ? "online" : (state.apiAvailable === false ? "offline" : "");
        const apiStatusText = state.apiAvailable === true ? "API online" : (state.apiAvailable === false ? "API unavailable" : "");
        
        // Build status content (initial with IANA timezone)
        locStatusContent.innerHTML = `
          <span>📍 ${escapeHtml(placeName)} (${loc.lat.toFixed(4)}, ${loc.lon.toFixed(4)})</span>
          <span>·</span>
          <span>🕒 ${escapeHtml(tzDisplay)}</span>
          <span>·</span>
          <span>🎛 ${escapeHtml(profileDisplay)}</span>
          <span>·</span>
          <span class="loc-status-api ${apiStatusClass}">${apiStatusText}</span>
        `;
        
        locStatusLine.style.display = "block";
        
        // Update timezone display if API responds (non-blocking)
        tzPromise.then(displayTz => {
          if(displayTz !== tzDisplay && locStatusContent && 
             state.location.lat === loc.lat && state.location.lon === loc.lon){
            // Rebuild status with updated timezone
            const apiStatusClass = state.apiAvailable === true ? "online" : (state.apiAvailable === false ? "offline" : "");
            const apiStatusText = state.apiAvailable === true ? "API online" : (state.apiAvailable === false ? "API unavailable" : "");
            locStatusContent.innerHTML = `
              <span>📍 ${escapeHtml(placeName)} (${loc.lat.toFixed(4)}, ${loc.lon.toFixed(4)})</span>
              <span>·</span>
              <span>🕒 ${escapeHtml(displayTz)}</span>
              <span>·</span>
              <span>🎛 ${escapeHtml(profileDisplay)}</span>
              <span>·</span>
              <span class="loc-status-api ${apiStatusClass}">${apiStatusText}</span>
            `;
          }
        });
      }
      
      // Copy permalink to clipboard
      async function copyPermalink(){
        const loc = state.location;
        if(!loc || !loc.lat || !loc.lon) return;
        
        // Build permalink URL
        const params = new URLSearchParams();
        if(loc.name && loc.name !== formatCoord(loc.lat, loc.lon)){
          params.append("q", loc.name);
        }else{
          params.append("lat", loc.lat.toFixed(4));
          params.append("lon", loc.lon.toFixed(4));
        }
        if(loc.tz && loc.tz !== "UTC"){
          params.append("tz", loc.tz);
        }
        
        const url = window.location.origin + window.location.pathname + "?" + params.toString();
        
        try{
          await navigator.clipboard.writeText(url);
          // Visual feedback: briefly change icon
          if(locShareBtn){
            const original = locShareBtn.textContent;
            locShareBtn.textContent = "✓";
            setTimeout(() => {
              if(locShareBtn) locShareBtn.textContent = original;
            }, 1000);
          }
        }catch(e){
          console.warn("Failed to copy:", e);
          setHint("Failed to copy permalink", true);
        }
      }


      // Show/hide dropdown
      function openDropdown(items){
        if(!locDropdown) return;
        closeDropdown();
        if(!items || items.length === 0) return;
        
        items.forEach(item => {
          const div = document.createElement("div");
          div.className = "loc-dd-item";
          const label = item.name + (item.admin1 ? ", " + item.admin1 : "") + (item.country ? ", " + item.country : "");
          div.innerHTML = `
            <div class="loc-dd-item-name">${escapeHtml(item.name)}</div>
            <div class="loc-dd-item-details">${escapeHtml(label)} · ${item.lat?.toFixed(2) || ""}, ${item.lon?.toFixed(2) || ""}</div>
          `;
          div.addEventListener("click", () => selectLocation(item));
          locDropdown.appendChild(div);
        });
        locDropdown.classList.add("show");
      }

      function closeDropdown(){
        if(!locDropdown) return;
        locDropdown.classList.remove("show");
        while(locDropdown.firstChild){
          locDropdown.removeChild(locDropdown.firstChild);
        }
      }

      // Show/hide hint message
      function setHint(message, isError = false){
        if(!locHint) return;
        if(message){
          locHint.textContent = message;
          locHint.className = "loc-hint" + (isError ? " error" : "");
          locHint.style.display = "block";
        }else{
          locHint.style.display = "none";
        }
      }

      function escapeHtml(s){
        if(!s) return "";
        const div = document.createElement("div");
        div.textContent = s;
        return div.innerHTML;
      }

      // Geocode: search for cities
      async function searchGeocode(q){
        // Try API first
        try{
          const res = await fetch(API_GEOCODE + "?q=" + encodeURIComponent(q));
          if(res.ok){
            const data = await res.json();
            geocodeAvailable = true;
            setHint("");
            // Handle different response formats
            const results = Array.isArray(data.results || data) ? (data.results || data) : [];
            return results.map(item => ({
              name: item.name || item.display_name?.split(',')[0] || 'Unknown',
              country: item.country || item.country_code || item.address?.country || '',
              admin1: item.admin1 || item.address?.state || '',
              lat: item.lat || item.latitude || parseFloat(item.lat) || 0,
              lon: item.lon || item.longitude || parseFloat(item.lon) || 0,
              tz: item.tz || item.timezone || ''
            })).filter(item => item.lat !== 0 && item.lon !== 0).slice(0, 6);
          }
          // If 404, API not available
          if(res.status === 404){
            geocodeAvailable = false;
            setHint("Geocode unavailable — paste coordinates instead.", true);
            return [];
          }
          throw new Error("HTTP " + res.status);
        }catch(e){
          console.warn("Geocode failed:", e);
          geocodeAvailable = false;
          setHint("Geocode unavailable — paste coordinates instead.", true);
          return [];
        }
      }

      async function lookupTimezone(lat, lon, country){
        // Try API first (most accurate)
        try{
          const url = API_TIMEZONE + "?lat=" + lat + "&lon=" + lon;
          console.log("Looking up timezone for", lat, lon, "via", url);
          const res = await fetch(url);
          if(res.ok){
            const data = await res.json();
            console.log("Timezone API response:", data);
            // API now returns: {timezone: "America/New_York", display: "Eastern Time (EST)", abbrev: "EST"}
            if(data.timezone){
              console.log("Using timezone:", data.timezone, "display:", data.display || data.timezone);
              return data.timezone; // Return IANA timezone for API calls
            }else{
              console.warn("Timezone API returned no timezone field:", data);
            }
          }else{
            console.warn("Timezone API returned status:", res.status);
          }
        }catch(e){
          console.warn("Timezone API failed, using fallback:", e);
        }
        
        // Fallback: simple guessing based on coordinates and country
        // UK / London
        if(country === "United Kingdom" || country === "UK" || 
           (lat > 50.0 && lat < 56.0 && lon > -6.0 && lon < 2.0)){
          return "Europe/London";
        }
        // Belgium
        if(country === "Belgium" || (lat > 50.5 && lat < 51.5 && lon > 2.5 && lon < 6.5)){
          return "Europe/Brussels";
        }
        // Germany
        if(country === "Germany" || (lat > 47.0 && lat < 55.0 && lon > 5.0 && lon < 15.0)){
          return "Europe/Berlin";
        }
        // Poland
        if(country === "Poland" || (lat > 49.0 && lat < 55.0 && lon > 14.0 && lon < 25.0)){
          return "Europe/Warsaw";
        }
        // Czech Republic
        if(country === "Czech Republic" || (lat > 48.5 && lat < 51.0 && lon > 12.0 && lon < 19.0)){
          return "Europe/Prague";
        }
        // France
        if(country === "France" || (lat > 42.0 && lat < 51.0 && lon > -5.0 && lon < 10.0)){
          return "Europe/Paris";
        }
        // Netherlands
        if(country === "Netherlands" || (lat > 50.7 && lat < 53.7 && lon > 3.0 && lon < 7.5)){
          return "Europe/Amsterdam";
        }
        // Default to browser timezone or UTC
        try{
          return Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";
        }catch(e){
          return "UTC";
        }
      }

      // Select location from dropdown or coordinates
      async function selectLocation(item){
        closeDropdown();
        if(!locInput) return;
        
        // Cancel any pending geolocation request
        state.geoRequestId = null;
        state.locationSource = "search";
        
        // Determine timezone (non-blocking - start fetch with UTC if slow)
        const tzPromise = item.tz 
          ? Promise.resolve(item.tz)
          : lookupTimezone(item.lat, item.lon, item.country).catch(() => "UTC");
        
        // Update state immediately with UTC timezone (will update when lookup completes)
        state.location = {
          name: item.name,
          lat: item.lat,
          lon: item.lon,
          tz: item.tz || "UTC" // Temporary, will update
        };
        
        locInput.value = item.name;
        updateStatusLine();
        saveLocation(state.location);
        
        // Fetch weather immediately (timezone lookup can complete in background)
        const tz = await Promise.race([
          tzPromise,
          new Promise(resolve => setTimeout(() => resolve("UTC"), 1000)) // 1s timeout
        ]);
        
        // Update timezone if we got it quickly
        if(tz && tz !== "UTC"){
          state.location.tz = tz;
          saveLocation(state.location);
          updateStatusLine();
        }
        
        // Fetch weather (works fine even with UTC timezone)
        await fetchAstroWeather(state.location.lat, state.location.lon, state.location.tz, "default", 72, state.location.name);
        
        // Update timezone in background if we got it later
        tzPromise.then(resolvedTz => {
          if(resolvedTz && resolvedTz !== "UTC" && 
             state.location.lat === item.lat && state.location.lon === item.lon){
            state.location.tz = resolvedTz;
            saveLocation(state.location);
            updateStatusLine();
          }
        });
      }

      // Use browser geolocation
      async function useMyLocation(){
        if(!navigator.geolocation){
          setHint("Geolocation not supported", true);
          return;
        }
        if(!locGeoBtn) return;
        
        locGeoBtn.disabled = true;
        setHint("");
        closeDropdown();
        
        // Mark that geolocation is in progress to prevent race conditions
        const geoRequestId = Date.now();
        state.geoRequestId = geoRequestId;
        
        navigator.geolocation.getCurrentPosition(
          async (pos) => {
            // Check if this request is still current (user didn't start another action)
            if(state.geoRequestId !== geoRequestId){
              console.log("Geolocation result ignored - newer request in progress");
              return;
            }
            
            const lat = pos.coords.latitude;
            const lon = pos.coords.longitude;
            let name = "My location";
            let tz = "UTC";
            
            try{
              // Try reverse geocode for name (non-blocking - fetch weather even if this fails)
              const revGeoPromise = fetch(API_REVGEO + "?lat=" + lat + "&lon=" + lon)
                .then(res => res.ok ? res.json() : null)
                .then(data => data?.name || null)
                .catch(() => null);
              
              // Lookup timezone (can be done in parallel)
              const tzPromise = lookupTimezone(lat, lon, "").catch(() => "UTC");
              
              // Wait for both, but don't block on reverse geocode
              const [revGeoName, resolvedTz] = await Promise.all([
                Promise.race([revGeoPromise, new Promise(resolve => setTimeout(() => resolve(null), 2000))]), // 2s timeout
                tzPromise
              ]);
              
              if(revGeoName) name = revGeoName; // Use full address if available
              tz = resolvedTz;
            }catch(e){
              console.warn("Location lookup failed:", e);
            }
            
            // Double-check this request is still current
            if(state.geoRequestId !== geoRequestId){
              console.log("Geolocation update ignored - newer request in progress");
              locGeoBtn.disabled = false;
              return;
            }
            
            // Update state and fetch
            state.location = {name, lat, lon, tz};
            state.locationSource = "geolocation";
            if(locInput) locInput.value = name;
            updateStatusLine();
            saveLocation(state.location);
            
            // Fetch weather (this will update UI even if reverse geocode was slow)
            await fetchAstroWeather(lat, lon, tz, "default", 72, name);
            
            // Final check before enabling button
            if(state.geoRequestId === geoRequestId){
              locGeoBtn.disabled = false;
            }
          },
          (err) => {
            if(state.geoRequestId === geoRequestId){
              setHint("Location permission denied", true);
              locGeoBtn.disabled = false;
            }
          }
        );
      }

      // Handle input: parse coordinates or search cities
      async function handleInput(){
        if(!locInput) return;
        const text = locInput.value.trim();
        
        // Cancel any pending geolocation request (user is typing manually)
        state.geoRequestId = null;
        
        if(!text){
          closeDropdown();
          setHint("");
          return;
        }
        
        // Try to parse coordinates first
        const coords = parseCoords(text);
        if(coords){
          // Coordinates detected - fetch immediately
          closeDropdown();
          setHint("");
          const clamped = clampLatLon(coords.lat, coords.lon);
          
          // Lookup timezone (non-blocking - can be slow)
          const tzPromise = lookupTimezone(clamped.lat, clamped.lon, "").catch(() => "UTC");
          
          // Use coordinates as name initially
          const coordName = formatCoord(clamped.lat, clamped.lon);
          state.location = {
            name: coordName,
            lat: clamped.lat,
            lon: clamped.lon,
            tz: "UTC" // Will update when timezone lookup completes
          };
          state.locationSource = "manual";
          
          updateStatusLine();
          saveLocation(state.location);
          
          // Fetch weather immediately with UTC timezone (will work fine)
          await fetchAstroWeather(clamped.lat, clamped.lon, "UTC", "default", 72, coordName);
          
          // Update timezone in background (non-blocking)
          tzPromise.then(tz => {
            if(state.location.lat === clamped.lat && state.location.lon === clamped.lon){
              // Only update if location hasn't changed
              state.location.tz = tz;
              saveLocation(state.location);
              updateStatusLine();
            }
          });
          
          return;
        }
        
        // Not coordinates - treat as city search
        if(text.length < 2){
          closeDropdown();
          return;
        }
        
        // Debounced city search
        if(searchDebounceTimer) clearTimeout(searchDebounceTimer);
        searchDebounceTimer = setTimeout(async () => {
          const results = await searchGeocode(text);
          if(results.length > 0){
            openDropdown(results);
          }else{
            closeDropdown();
          }
        }, 400);
      }

      async function fetchAstroWeather(lat, lon, tz, profile = "default", hours = 72, locationName = null){
        state.fetching = true;
        setHint("");
        if(jsonEl) jsonEl.textContent = "Fetching weather data…";
        if(errEl) errEl.style.display = "none";
        
        try{
          // Try API first
          const params = new URLSearchParams({
            lat: String(lat),
            lon: String(lon),
            tz: tz || "Europe/Warsaw",
            hours: String(hours),
            profile: profile,
          });
          // Add location name if available
          if(locationName){
            params.append("name", locationName);
          }
          const url = API_ASTRO_WEATHER + "?" + params.toString();
          const res = await fetch(url);
          if(res.ok){
            const data = await res.json();
            renderWeatherData(data);
            state.fetching = false;
            return;
          }
          // If 404 or other error, fallback to static JSON
          if(res.status === 404){
            console.warn("API not available (404). Run 'make server-api' for full functionality. Falling back to static JSON...");
            await fetchAstroWeatherStatic(lat, lon, tz);
            state.fetching = false;
            return;
          }
          const text = await res.text();
          throw new Error("HTTP " + res.status + ": " + text.substring(0, 100));
        }catch(e){
          // Network error or API unavailable - try static fallback
          console.warn("API failed, trying static fallback:", e);
          console.warn("Note: Run 'make server-api' for full API functionality (astro-weather, geocode, revgeo)");
          try{
            await fetchAstroWeatherStatic(lat, lon, tz);
            state.fetching = false;
          }catch(e2){
            state.fetching = false;
            if(jsonEl) jsonEl.textContent = "—";
            if(errEl){
              errEl.textContent = "API error: " + (e.message || e) + ". Static fallback also failed: " + (e2.message || e2) + ". Run 'make server-api' for full functionality.";
              errEl.style.display = "block";
            }
            setHint("Failed to fetch weather data. " + (e2.message || e2), true);
            throw e2;
          }
        }
      }

      async function fetchAstroWeatherStatic(lat, lon, tz){
        if(jsonEl) jsonEl.textContent = "Loading static location data…";
        try{
          // Try to find matching location from static index
          const indexRes = await fetch(STATIC_LOCATIONS_INDEX + "?ts=" + Date.now());
          if(!indexRes.ok) throw new Error("Static index not found");
          const index = await indexRes.json();
          const locations = Array.isArray(index.locations) ? index.locations : [];
          
          // Find closest location (simple distance)
          let bestLoc = null;
          let bestDist = Infinity;
          for(const loc of locations){
            const dist = Math.abs(loc.lat - lat) + Math.abs(loc.lon - lon);
            if(dist < bestDist){
              bestDist = dist;
              bestLoc = loc;
            }
          }
          
          if(!bestLoc){
            throw new Error("No matching static location found");
          }
          
          // Only use static fallback if location is close to one of the presets (within 0.5 degrees ≈ 50km)
          // Otherwise, require API to be available
          if(bestDist > 0.5){
            const distKm = Math.round(bestDist * 111); // Rough conversion: 1 degree ≈ 111 km
            const locName = state.location?.name || formatCoord(lat, lon);
            throw new Error(
              `Selected location "${locName}" is too far from available static data. ` +
              `Closest preset is ${bestLoc.name} (~${distKm} km away). ` +
              `\n\nTo use this location, run: make server-api\n` +
              `Or paste coordinates directly (e.g., "50.087, 14.421")`
            );
          }
          
          const locUrl = STATIC_LOC_BASE + "/" + bestLoc.id + ".json?ts=" + Date.now();
          console.log("Fetching static JSON from:", locUrl);
          const res = await fetch(locUrl);
          if(!res.ok){
            throw new Error("Static location JSON not found: " + locUrl + " (HTTP " + res.status + ")");
          }
          const data = await res.json();
          if(!data || !data.location){
            throw new Error("Invalid static JSON format");
          }
          
          // Transform static JSON to match API format
          const transformed = {
            generated_at: data.generated_at || new Date().toISOString(),
            location: {
              name: data.location.name || bestLoc.name,
              lat: data.location.lat || bestLoc.lat,
              lon: data.location.lon || bestLoc.lon,
              tz: data.location.tz || bestLoc.tz || tz || "Europe/Warsaw"
            },
            horizon_hours: data.horizon_hours || (Array.isArray(data.hours) ? data.hours.length : 0),
            profile: "default",
            derived: data.derived || data.trends || {},
            hours: Array.isArray(data.hours) ? data.hours.map(h => {
              // Handle different score_breakdown formats
              let breakdown = h.score_breakdown;
              const score = h.score || h.score_profiles?.balanced || 0;
              
              if(Array.isArray(breakdown)){
                // Convert array format (from static JSON) to object format (API contract)
                // Static JSON has: {key, label, max, raw, normalized, earned}
                // API expects: {components: [{key, label, value, points}], total, clamped_total}
                const components = breakdown.map(c => ({
                  key: c.key || "",
                  label: c.label || "",
                  value: c.raw !== undefined ? c.raw : (c.value !== undefined ? c.value : 0),
                  points: c.earned !== undefined ? c.earned : (c.points !== undefined ? c.points : 0)
                }));
                const total = components.reduce((sum, c) => sum + (c.points || 0), 0);
                breakdown = {
                  components: components,
                  total: total,
                  clamped_total: score
                };
              }else if(breakdown && typeof breakdown === "object" && breakdown.components){
                // Already in API format, ensure total matches
                if(breakdown.total === undefined){
                  breakdown.total = breakdown.components.reduce((sum, c) => sum + (c.points || 0), 0);
                }
                if(breakdown.clamped_total === undefined){
                  breakdown.clamped_total = score;
                }
              }else{
                // No breakdown or invalid format
                breakdown = {
                  components: [],
                  total: score,
                  clamped_total: score
                };
              }
              
              return {
                ...h,
                score: score,
                score_breakdown: breakdown
              };
            }) : []
          };
          
          console.log("Static fallback successful, loaded:", bestLoc.name);
          renderWeatherData(transformed);
        }catch(e){
          console.error("Static fallback error:", e);
          throw new Error("Static fallback failed: " + (e.message || e));
        }
      }

      function renderWeatherData(data){
        if(!jsonEl) return;
        if(!data || !data.location){
          console.error("Invalid data:", data);
          return;
        }
        
        // Update location state from API response (may have better name/timezone)
        // But preserve the user-selected name if API returned just coordinates
        if(data.location){
          const apiName = data.location.name || "";
          const userSelectedName = state.location?.name || "";
          // If API returned coordinates as name, use user-selected name instead
          const finalName = (apiName.match(/^-?\d+\.\d+,-?\d+\.\d+$/) && userSelectedName) 
            ? userSelectedName 
            : (apiName || userSelectedName);
          
          state.location = {
            name: finalName,
            lat: data.location.lat || state.location.lat,
            lon: data.location.lon || state.location.lon,
            tz: data.location.tz || state.location.tz
          };
          // Update profile from API response
          if(data.profile){
            state.profile = data.profile;
          }
          // Update UI with actual location from API
          updateStatusLine();
          
          // Update input field
          if(locInput && finalName && !finalName.match(/^-?\d+\.\d+,-?\d+\.\d+$/)){
            locInput.value = finalName;
          }
        }
        
        const preview = {
          generated_at: data.generated_at,
          location: data.location,
          horizon_hours: data.horizon_hours,
          profile: data.profile || "default",
          derived: data.derived || {},
          hours_preview: Array.isArray(data.hours) ? data.hours.slice(0, 3).map(h => ({
            time: h.time,
            cloud_total: h.cloud_total,
            wind_m_s: h.wind_m_s,
            temp_c: h.temp_c,
            score: h.score,
            score_breakdown: h.score_breakdown,
          })) : []
        };
        jsonEl.textContent = JSON.stringify(preview, null, 2);
      }

      // Event listeners for new compact UI
      if(locInput){
        // Input change handler (debounced)
        const debouncedHandleInput = debounce(handleInput, 300);
        locInput.addEventListener("input", debouncedHandleInput);
        
        // Enter key: parse coordinates or select first dropdown item
        locInput.addEventListener("keydown", async function(e){
          if(e.key === "Enter"){
            e.preventDefault();
            const text = this.value.trim();
            const coords = parseCoords(text);
            if(coords){
              // Coordinates - handle immediately
              await handleInput();
            }else{
              // City - select first dropdown item if available
              const firstItem = locDropdown?.querySelector(".loc-dd-item");
              if(firstItem){
                firstItem.click();
              }else{
                // No dropdown - try to search anyway
                await handleInput();
              }
            }
          }else if(e.key === "Escape"){
            closeDropdown();
            setHint("");
          }
        });
        
        // Paste handler
        locInput.addEventListener("paste", function(e){
          setTimeout(() => {
            handleInput();
          }, 10);
        });
      }

      // Geolocation button
      if(locGeoBtn){
        locGeoBtn.addEventListener("click", useMyLocation);
      }

      // Share button
      if(locShareBtn){
        locShareBtn.addEventListener("click", copyPermalink);
      }

      // Close dropdown on outside click
      document.addEventListener("click", function(e){
        if(locDropdown && !locInput?.contains(e.target) && !locDropdown.contains(e.target)){
          closeDropdown();
        }
      });

      // Close dropdown on Escape
      document.addEventListener("keydown", function(e){
        if(e.key === "Escape"){
          closeDropdown();
        }
      });

      // Check API availability
      async function checkAPIStatus(){
        try{
          const res = await fetch(API_ASTRO_WEATHER + "?lat=52.2297&lon=21.0122&tz=Europe/Warsaw&hours=1&profile=default");
          state.apiAvailable = res.ok;
        }catch(e){
          state.apiAvailable = false;
        }
        // Update status line to reflect API status
        updateStatusLine();
      }

      function init(){
        if(!locInput || !locGeoBtn || !locDropdown){
          console.error("Location UI elements not found");
          if(errEl){
            errEl.textContent = "UI initialization error: missing elements";
            errEl.style.display = "block";
          }
          return;
        }
        
        // Load saved location
        state.location = loadSavedLocation();
        state.locationSource = "saved";
        if(locInput){
          locInput.value = state.location.name || formatCoord(state.location.lat, state.location.lon);
        }
        updateStatusLine();
        
        // Check API status
        checkAPIStatus();
        
        // Try to load location from URL params first
        const params = new URLSearchParams(window.location.search);
        const q = params.get("q");
        const lat = params.get("lat");
        const lon = params.get("lon");
        
        if(q){
          // City name query
          if(locInput) locInput.value = q;
          setTimeout(() => handleInput(), 100);
        }else if(lat && lon){
          // Coordinates
          const coords = {lat: parseFloat(lat), lon: parseFloat(lon)};
          if(!isNaN(coords.lat) && !isNaN(coords.lon)){
            if(locInput) locInput.value = lat + ", " + lon;
            setTimeout(() => handleInput(), 100);
          }else{
            // Fallback to saved/default location
            fetchAstroWeather(state.location.lat, state.location.lon, state.location.tz, "default", 72, state.location.name).catch(e => {
              console.error("Initial fetch failed:", e);
              if(errEl){
                errEl.textContent = "Failed to load weather data: " + (e.message || e);
                errEl.style.display = "block";
              }
            });
          }
        }else{
          // No URL params - use saved/default location
          fetchAstroWeather(state.location.lat, state.location.lon, state.location.tz, "default", 72, state.location.name).catch(e => {
            console.error("Initial fetch failed:", e);
            if(errEl){
              errEl.textContent = "Failed to load weather data: " + (e.message || e);
              errEl.style.display = "block";
            }
          });
        }
      }
      
      if(document.readyState === "loading"){
        document.addEventListener("DOMContentLoaded", init);
      }else{
        init();
      }
    })();
  </script>
