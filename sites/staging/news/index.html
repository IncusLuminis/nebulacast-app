<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nebulacast — News</title>
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/widget_news.css">
</head>
<body>
  <div class="page-wrap">
    <header class="page-header">
      <h1>Nebulacast</h1>
      <p class="subtitle">Staging · News</p>
    </header>
    <main>
      <div id="nrw-root-page" class="nrw-root">
  <div class="nrw-header">
    <div class="nrw-title">News Radar</div>
    <div class="nrw-meta"><a class="nrw-rss" href="/news/rss.xml" target="_blank" rel="noopener">RSS</a></div>
  </div>
  <div class="nrw-filters" data-role="filters"></div>
  <div class="nrw-status" data-role="status">Loading...</div>
  <div class="nrw-list" data-role="list"></div>
</div>

      <p class="rss-link"><a href="/news/rss.xml">RSS feed</a></p>
    </main>
  </div>
  <script src="/assets/js/widget_runtime.js"></script>
  <script>
    (function() {
      var config = {"rootId": "nrw-root-page", "rssUrl": "/news/rss.xml", "maxItems": 12, "parseMax": 300, "filters": ["All", "News", "Science", "Videos", "Images", "Nebulacast"]};
      if (window.runNewsWidget) window.runNewsWidget(config);
    })();
  </script>
</body>
</html>
