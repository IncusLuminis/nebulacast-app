<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nebulacast — Weather</title>
  <link rel="stylesheet" href="./assets/weather.css">
  <link rel="stylesheet" href="./widgets/location/location.css">
  <link rel="stylesheet" href="./widgets/controls/controls.css">
  <link rel="stylesheet" href="./widgets/weather/weather.css">
  <link rel="stylesheet" href="./widgets/map/map.css">
  <link rel="stylesheet" href="./widgets/astro/astro.css">
</head>
<body>
  <div class="page-wrap">
    <header class="page-header">
      <h1>Nebulacast</h1>
      <p class="subtitle">Staging · Weather</p>
    </header>
    
    <main>
      <!-- Location widget (always visible) -->
      <div id="w-location" class="widget-container"></div>
      
      <!-- Controls: Profile + Time range (below Location) -->
      <div id="w-controls" class="widget-container"></div>
      
      <!-- Tabs for Weather/Map/Astro -->
      <div class="widget-tabs">
        <button class="widget-tab active" data-tab="weather">Weather</button>
        <button class="widget-tab" data-tab="map">Map</button>
        <button class="widget-tab" data-tab="astro">Astro</button>
      </div>
      
      <!-- Tab content containers -->
      <div id="w-weather" class="widget-container widget-tab-content active"></div>
      <div id="w-map" class="widget-container widget-tab-content"></div>
      <div id="w-astro" class="widget-container widget-tab-content"></div>
    </main>
  </div>

  <!-- Weather widget modals (shared across all widgets) -->
  <!-- Bottom sheet modal (legacy parameter details) -->
  <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-sheet">
      <div class="modal-header">
        <h3 id="modal-title">Parameter Details</h3>
        <button class="modal-close" aria-label="Close">&times;</button>
      </div>
      <div class="modal-content" id="modal-content"></div>
    </div>
  </div>

  <!-- Factor tooltip (breakdown (i) icons) -->
  <div class="factor-tooltip" id="factorTooltip" role="tooltip" aria-hidden="true">
    <div class="factor-tooltip-title" id="factorTooltipTitle"></div>
    <div class="factor-tooltip-body" id="factorTooltipBody"></div>
  </div>

  <!-- Chip popover (L1 details) -->
  <div class="chip-overlay" id="chipOverlay" role="dialog" aria-modal="true" aria-labelledby="chipSheetTitle">
    <div class="chip-sheet" id="chipSheet">
      <div class="sheet-hdr">
        <h3 id="chipSheetTitle"></h3>
      </div>
      <div class="chip-sheet-body" id="chipSheetBody"></div>
    </div>
  </div>

  <!-- Chart overlay (mini-chart detail view) -->
  <div class="chart-overlay" id="chartOverlay" role="dialog" aria-modal="true" aria-labelledby="chartOverlayTitle" aria-hidden="true">
    <div class="chart-overlay-backdrop"></div>
    <div class="chart-overlay-panel">
      <div class="chart-overlay-header">
        <h3 id="chartOverlayTitle">Score • Warsaw</h3>
        <button class="chart-overlay-close" aria-label="Close">&times;</button>
      </div>
      <div class="chart-overlay-subheader" id="chartOverlaySubheader">
        Horizon: TONIGHT • Profile: Balanced • Updated: —
      </div>
      <div class="chart-overlay-canvas-wrapper">
        <canvas id="chartCanvas" width="800" height="300"></canvas>
        <div class="chart-tooltip" id="chartTooltip" aria-hidden="true"></div>
      </div>
      <div class="chart-overlay-footer">
        <div class="chart-stat">
          <span class="chart-stat-label">Now:</span>
          <span class="chart-stat-value" id="chartStatNow">—</span>
        </div>
        <div class="chart-stat">
          <span class="chart-stat-label">Min:</span>
          <span class="chart-stat-value" id="chartStatMin">—</span>
        </div>
        <div class="chart-stat">
          <span class="chart-stat-label">Max:</span>
          <span class="chart-stat-value" id="chartStatMax">—</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Hour Inspector bottom sheet -->
  <div class="hour-inspector-backdrop" id="hourInspectorBackdrop" aria-hidden="true"></div>
  <div class="hour-inspector-sheet" id="hourInspectorSheet" role="dialog" aria-modal="true" aria-labelledby="hourInspectorTitle" aria-hidden="true">
    <div class="hour-inspector-header" id="hourInspectorHeader">
      <div class="hour-inspector-header-left">
        <div class="hour-inspector-time" id="hourInspectorTime">—</div>
        <div class="hour-inspector-score-block">
          <div class="hour-inspector-score-val" id="hourInspectorScoreVal">—</div>
          <div class="hour-inspector-score-label" id="hourInspectorScoreLabel">—</div>
        </div>
      </div>
      <button class="hour-inspector-close" aria-label="Close">&times;</button>
    </div>
    <div class="hour-inspector-summary" id="hourInspectorSummary">—</div>
    <div class="hour-inspector-body" id="hourInspectorBody">
      <!-- Content will be rendered by JavaScript -->
    </div>
  </div>

  <script type="module">
    import { initState, getState, setState, subscribe } from "./core/state.js";
    import { mountLocation } from "./widgets/location/location.js";
    import { mountControls } from "./widgets/controls/controls.js";
    import { mountWeather } from "./widgets/weather/weather.js";
    import { mountMap } from "./widgets/map/map.js";
    import { mountAstro } from "./widgets/astro/astro.js";

    // Create store API object
    const storeApi = {
      getState,
      setState,
      subscribe
    };

    // Initialize state from URL
    initState();

    // Mount location widget (always visible)
    const locationEl = document.getElementById("w-location");
    if (locationEl) {
      mountLocation(locationEl, storeApi);
    }

    const controlsEl = document.getElementById("w-controls");
    if (controlsEl) {
      mountControls(controlsEl, storeApi);
    }

    // Mount tab widgets
    const weatherEl = document.getElementById("w-weather");
    const mapEl = document.getElementById("w-map");
    const astroEl = document.getElementById("w-astro");

    if (weatherEl) {
      mountWeather(weatherEl, storeApi);
    }

    if (mapEl) {
      mountMap(mapEl, storeApi);
    }

    if (astroEl) {
      mountAstro(astroEl, storeApi);
    }

    // Tab switching logic
    const tabs = document.querySelectorAll(".widget-tab");
    const tabContents = document.querySelectorAll(".widget-tab-content");
    
    tabs.forEach(tab => {
      tab.addEventListener("click", () => {
        const targetTab = tab.dataset.tab;
        
        // Update active tab
        tabs.forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        
        // Show/hide content
        tabContents.forEach(content => {
          const isTarget = content.id === `w-${targetTab}`;
          content.classList.toggle("active", isTarget);
        });
      });
    });

    // Initial render for all widgets (they subscribe to state changes)
    const initialState = getState();
    // Widgets will render automatically via their subscriptions
  </script>
</body>
</html>
