<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nebulacast — Widget Lab</title>
  <link rel="stylesheet" href="/showcase/showcase.css">
</head>
<body>
<div class="page">
  <header class="page-header">
    <h1>Widget Lab</h1>
    <p>Nebulacast · select a widget, configure its container, and inspect a live Runtime preview</p>
  </header>

  <main id="widget-lab" aria-live="polite"></main>

  <footer class="page-footer">
    <span>Nebulacast · Staging</span>
    <span id="footer-ts">—</span>
  </footer>
</div>

<script type="module">
  import { getState, setState, subscribe } from "/weather/core/state.js";
  import { createPlatformContext } from "/weather/core/context.js";
  import { createWidgetLab } from "/showcase/widget-lab-stage.mjs";

  const storeApi = { getState, setState, subscribe };
  const context = createPlatformContext(storeApi, { locale: "en", theme: "auto" });
  const lab = createWidgetLab({
    root: document.getElementById("widget-lab"),
    context,
  });
  lab.mount().catch(error => {
    const status = document.createElement("p");
    status.className = "gallery-status gallery-status-error";
    status.textContent = `Widget Lab failed to initialize: ${error.message}`;
    document.getElementById("widget-lab")?.appendChild(status);
  });
</script>
</body>
</html>
