<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 24 24"
     fill="none"
     stroke-width="1.8"
     stroke-linecap="round"
     stroke-linejoin="round">

  <defs>
    <!-- sun core gradient: lighter center → darker edge -->
    <linearGradient id="gSunCore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF3C4"/>
      <stop offset="1" stop-color="#FFCF5A"/>
    </linearGradient>
    <!-- stroke/rays gradient: edge slightly darker than core -->
    <linearGradient id="gSunStroke" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFCF5A"/>
      <stop offset="1" stop-color="#FFB13A"/>
    </linearGradient>
  </defs>

  <!-- sun group scaled down ~10% around center -->
  <g transform="translate(12,12) scale(0.9) translate(-12,-12)">
    <!-- sun core (light center, darker edge, ~60% larger than original radius before scale) -->
    <circle cx="12" cy="12" r="7.2" fill="url(#gSunCore)" stroke="url(#gSunCore)"/>

    <!-- rays (same gradient color as sun core) -->
    <path d="M12 2.5v3.2M12 18.3v3.2M4.2 4.2l2.3 2.3M17.5 17.5l2.3 2.3M2.5 12h3.2M18.3 12h3.2M4.2 19.8l2.3-2.3M17.5 6.5l2.3-2.3"
          stroke="url(#gSunCore)"/>
  </g>
</svg>
