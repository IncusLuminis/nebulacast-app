<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 24 24"
     fill="none"
     stroke="#E6ECF5"
     stroke-width="1.8"
     stroke-linecap="round"
     stroke-linejoin="round">

  <defs>
    <linearGradient id="gCloudRain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D7E7FF"/>
      <stop offset="1" stop-color="#86AFFF"/>
    </linearGradient>
  </defs>

  <!-- cloud with gradient stroke like base cloud -->
  <path d="M6.5 13.5
           C6.8 11.4 8.5 10 10.5 10
           c1.8 0 3.3 1 3.9 2.6
           c0.3-0.1 0.7-0.1 1-0.1
           c2.1 0 3.8 1.6 3.8 3.6
           S17.1 20 15 20H8.5
           C6.6 20 5 18.5 5 16.6
           c0-1.0 0.6-1.8 1.5-2.1z"
        fill="url(#gCloudRain)"
        stroke="url(#gCloudRain)"/>

  <!-- rain drops -->
  <g stroke="#6EC1FF">
    <path d="M9 20.5l-1.2 2"/>
    <path d="M12 20.5l-1.2 2"/>
    <path d="M15 20.5l-1.2 2"/>
  </g>
