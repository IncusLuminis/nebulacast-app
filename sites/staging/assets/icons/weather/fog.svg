           S17.1 20 15 20H8.5
           C6.6 20 5 18.5 5 16.6
           c0-1.0 0.6-1.8 1.5-2.1z"
        fill="url(#gCloudSmall)"
        stroke="url(#gCloudSmall)"/>

  <!-- fog lines -->
  <g stroke="#AAB3C2">
    <path d="M3 18.5h10"/>
    <path d="M5 20.5h11"/>
    <path d="M3 22.5h10"/>
