<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 24 24"
     fill="none"
     stroke="#E6ECF5"
     stroke-width="1.8"
     stroke-linecap="round"
     stroke-linejoin="round">

  <defs>
    <linearGradient id="gCloudSmall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D7E7FF"/>
      <stop offset="1" stop-color="#86AFFF"/>
    </linearGradient>
  </defs>

  <!-- small cloud with same gradient and stroke as base cloud -->
  <path d="M6.5 14.5
           C6.8 12.4 8.5 11 10.5 11
           c1.5 0 2.9 0.8 3.5 2.1
           c0.3-0.1 0.7-0.1 1-0.1
