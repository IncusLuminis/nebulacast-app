<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Partly cloudy">
  <defs>
    <!-- sun gradient: lighter top-left → darker bottom-right -->
    <linearGradient id="gSun2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE8A6"/>
      <stop offset="1" stop-color="#FFB13A"/>
    </linearGradient>
    <!-- cloud gradient unified with base cloud -->
    <linearGradient id="gCloud" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D7E7FF"/>
      <stop offset="1" stop-color="#86AFFF"/>
    </linearGradient>
  </defs>

  <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="scale(0.375)">
    <!-- sun behind (disk + rays share same orange gradient) -->
    <path d="M20 10v6M20 34v6M8 22h6M26 22h6M11 13l4 4M25 27l4 4M29 13l-4 4"
          stroke="url(#gSun2)"/>
    <!-- radius 8 → 9.6 (~+20%) to make sun larger -->
    <circle cx="20" cy="22" r="9.6" fill="url(#gSun2)" stroke="url(#gSun2)"/>

    <!-- cloud front with gradient stroke like base cloud, shifted slightly right/down to reveal more sun -->
    <path d="M22 44h22c6 0 10-3.5 10-8.5S50 27 44 27c-1.3-6.4-6.6-10-13-10-6.7 0-12 4.2-13.2 10.6C12.5 28.5 8 31.8 8 36c0 4.8 4.1 8 14 8z"
          transform="translate(2,1)"
          fill="url(#gCloud)" stroke="url(#gCloud)"/>
  </g>
</svg>
