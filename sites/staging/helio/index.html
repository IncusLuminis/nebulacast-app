<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nebulacast — Space Weather</title>
  <style>
    :root {
      --bg: #0b0d12;
      --text: #e6e6e6;
      --muted: #9aa3b2;
      --line: #2a2f3a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      min-height: 100vh;
    }
    .page-shell {
      max-width: 640px;
      margin: 0 auto;
      padding: 16px 12px 40px;
    }
    .page-header {
      padding-bottom: 12px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .page-title {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      color: #e6f2ff;
      letter-spacing: 0.04em;
    }
    .page-subtitle {
      margin: 0;
      font-size: 12px;
      color: var(--muted);
    }
    #w-helio { width: 100%; }
    .page-diag {
      margin-top: 20px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 11px;
      color: var(--muted);
      line-height: 1.6;
    }
    .page-diag-row { display: flex; gap: 8px; }
    .page-diag-label { min-width: 80px; flex-shrink: 0; }
    .page-error {
      margin-top: 12px;
      padding: 12px;
      background: #1e1010;
      border: 1px solid #4a2020;
      border-radius: 8px;
      color: #e07070;
      font-size: 13px;
      display: none;
    }
    .page-error.visible { display: block; }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="page-header">
      <h1 class="page-title">Space Weather</h1>
      <span class="page-subtitle">Nebulacast · Helio</span>
    </header>

    <div id="w-helio"></div>
    <div id="page-error" class="page-error" role="alert"></div>

    <footer class="page-diag" aria-label="Diagnostics">
      <div class="page-diag-row">
        <span class="page-diag-label">Widget</span>
        <span><b>Space Weather Runtime</b></span>
      </div>
      <div class="page-diag-row">
        <span class="page-diag-label">Data URL</span>
        <span>/data/helio_now.json</span>
      </div>
    </footer>
  </div>

  <script type="module">
    import { mountHelioPage } from "./page-composer.mjs?v=20260915a";
    window.helioPageComposer = await mountHelioPage();
  </script>
</body>
</html>
