<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nebulacast — Console</title>

  <!-- Base styles -->
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/widget_news.css">
  <link rel="stylesheet" href="/assets/css/widget_calendar.css">

  <!-- Weather widget styles -->
  <link rel="stylesheet" href="/weather/assets/weather.css">
  <link rel="stylesheet" href="/weather/widgets/location/location.css">
  <link rel="stylesheet" href="/weather/widgets/controls/controls.css">
  <link rel="stylesheet" href="/weather/widgets/weather/weather.css">
  <link rel="stylesheet" href="/weather/widgets/map/map.css">
  <link rel="stylesheet" href="/weather/widgets/sun_moon/sun_moon.css">
  <link rel="stylesheet" href="/weather/widgets/astro/astro.css">

  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0e14;
      color: #fff;
      overflow: hidden;
    }

    /* ─── Console root grid ────────────────────────────────── */
    .console-root {
      display: grid;
      grid-template-rows: 52px 1fr;
      grid-template-columns: 272px 1fr;
      row-gap: 8px;
      height: 100vh;
      overflow: hidden;
    }

    /* ─── Topbar cells ───────────────────────────────────────*/
    .console-topbar-brand {
      background: rgba(16, 20, 32, 0.98);
      border-bottom: 1px solid rgba(255,255,255,0.07);
      border-right: 1px solid rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      padding: 0 14px;
      z-index: 50;
    }

    .console-topbar-location {
      background: rgba(16, 20, 32, 0.98);
      border-bottom: 1px solid rgba(255,255,255,0.07);
      display: flex;
      align-items: center;
      padding: 9px 20px 0;
      z-index: 50;
      min-width: 0;
    }

    .console-topbar-location #w-location {
      flex: 1;
      min-width: 0;
    }

    .console-brand {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: rgba(255,255,255,0.7);
      white-space: nowrap;
    }

    .console-brand span {
      color: #4a6fa5;
    }

    /* ─── Brand bar at top of left feed column ───────────── */
    .console-brand-bar {
      background: rgba(16, 20, 32, 0.98);
      border-bottom: 1px solid rgba(255,255,255,0.07);
      padding: 13px 14px 11px;
      flex-shrink: 0;
    }

    /* ─── Hero Decision Band ─────────────────────────────────*/
    .console-hero {
      background: rgba(14, 18, 28, 0.97);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding: 10px 20px;
      display: flex;
      align-items: stretch;
      gap: 1px;
      min-height: 84px;
      flex-shrink: 0;
    }

    .hero-card {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding: 6px 18px;
      border-right: 1px solid rgba(255,255,255,0.06);
      gap: 4px;
      min-width: 0;
    }
    .hero-card:last-child { border-right: none; }

    .hero-card-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
    }

    .hero-card-value {
      font-size: 28px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .hero-card-sub {
      font-size: 11px;
      color: rgba(255,255,255,0.55);
      white-space: nowrap;
    }

    /* Score card colors */
    .score-excellent .hero-card-value { color: #4caf50; }
    .score-good      .hero-card-value { color: #8bc34a; }
    .score-fair      .hero-card-value { color: #ff9800; }
    .score-poor      .hero-card-value { color: #f44336; }

    /* Risk chips */
    .hero-risks {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 2px;
    }

    .risk-chip {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 20px;
      font-weight: 600;
      letter-spacing: 0.03em;
    }
    .risk-chip.medium {
      background: rgba(255, 152, 0, 0.15);
      color: #ff9800;
      border: 1px solid rgba(255,152,0,0.3);
    }
    .risk-chip.high {
      background: rgba(244, 67, 54, 0.15);
      color: #f44336;
      border: 1px solid rgba(244,67,54,0.3);
    }
    .risk-chip.low {
      background: rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.3);
      border: 1px solid rgba(255,255,255,0.08);
    }

    /* Space weather status */
    .sw-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
      margin-top: 2px;
    }
    .sw-badge.quiet   { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.45); }
    .sw-badge.active  { background: rgba(255,152,0,0.15); color: #ff9800; }
    .sw-badge.storm   { background: rgba(244,67,54,0.15); color: #f44336; }
    .sw-badge::before {
      content: '';
      width: 6px; height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .hero-skeleton {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 4px;
      color: rgba(255,255,255,0.4);
      font-size: 12px;
    }

    /* ─── Night Overview Panel ──────────────────────────── */
    .console-hero { min-height: 110px; overflow-x: auto; }

    .nop-scales { display: flex; gap: 3px; margin-top: 5px; }
    .nop-scale-badge {
      font-size: 9px; font-weight: 700; padding: 2px 6px;
      border-radius: 3px; letter-spacing: 0.04em;
    }

    .nop-sun-times {
      font-size: 10px; color: rgba(255,255,255,0.5); text-align: center; white-space: nowrap;
    }

    .nop-summary-text {
      font-size: 11px; color: rgba(255,255,255,0.62); line-height: 1.55; margin-top: 5px;
    }

    .nop-moon-times { margin-top: 4px; text-align: center; }

    .nop-profiles { display: flex; flex-direction: column; gap: 3px; }
    .nop-profile-btn {
      font-size: 9px; font-weight: 600; padding: 3px 8px; border-radius: 3px;
      border: 1px solid rgba(255,255,255,0.1); background: transparent;
      color: rgba(255,255,255,0.38); cursor: pointer; letter-spacing: 0.02em; line-height: 1.4;
      transition: all 0.15s; text-align: left; width: 100%;
    }
    .nop-profile-btn.is-active, .nop-profile-btn:hover {
      background: rgba(74,111,165,0.2); border-color: rgba(74,111,165,0.4); color: rgba(255,255,255,0.82);
    }

    .nop-window-time {
      font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.82); margin-top: 3px; white-space: nowrap;
    }
    .nop-bar-chart { display: flex; align-items: flex-end; gap: 1px; height: 44px; position: relative; }
    .nop-bar {
      flex: 1; min-width: 4px; border-radius: 1px 1px 0 0;
      transition: height 0.25s, background 0.2s; cursor: default;
    }
    .nop-bar:hover { filter: brightness(1.4); }
    .nop-tooltip {
      position: fixed; z-index: 999; pointer-events: none;
      background: rgba(16,20,32,0.96); border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.85); font-size: 10px; font-weight: 500;
      padding: 3px 7px; border-radius: 4px; white-space: nowrap;
      display: none; box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    .nop-chips { display: flex; gap: 3px; margin-top: 5px; flex-wrap: wrap; }
    .nop-chip {
      font-size: 9px; font-weight: 600; padding: 2px 6px; border-radius: 3px;
      border: 1px solid rgba(255,255,255,0.1); background: transparent;
      color: rgba(255,255,255,0.35); cursor: pointer; line-height: 1.4; transition: all 0.15s;
    }
    .nop-chip.is-active, .nop-chip:hover {
      background: rgba(74,111,165,0.18); border-color: rgba(74,111,165,0.4); color: rgba(255,255,255,0.72);
    }

    /* ─── Right column (topbar + hero + tools) ─────────────── */
    .console-right {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }

    /* ─── Priority Feed ──────────────────────────────────── */
    .console-feed {
      background: rgba(12, 16, 26, 0.98);
      border-right: 1px solid rgba(255,255,255,0.06);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
    }
    .console-feed::-webkit-scrollbar { width: 4px; }
    .console-feed::-webkit-scrollbar-track { background: transparent; }
    .console-feed::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    .feed-header {
      padding: 10px 14px 8px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      border-bottom: 1px solid rgba(255,255,255,0.05);
      flex-shrink: 0;
    }

    .feed-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0;
    }

    .feed-list::-webkit-scrollbar { width: 4px; }
    .feed-list::-webkit-scrollbar-track { background: transparent; }
    .feed-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    .feed-item {
      display: grid;
      grid-template-columns: 22px 22px 1fr auto;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      cursor: pointer;
      transition: background 0.15s;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }

    .feed-item:hover {
      background: rgba(255,255,255,0.04);
    }

    .feed-item:last-child { border-bottom: none; }

    .feed-rank {
      font-size: 10px;
      font-weight: 700;
      color: rgba(255,255,255,0.35);
      text-align: right;
    }

    .feed-icon {
      font-size: 14px;
      text-align: center;
      line-height: 1;
    }

    .feed-info {
      min-width: 0;
    }

    .feed-name {
      font-size: 12px;
      font-weight: 600;
      color: rgba(255,255,255,0.85);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }

    .feed-sub {
      font-size: 10px;
      color: rgba(255,255,255,0.5);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }

    .feed-score-col {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 3px;
      flex-shrink: 0;
    }

    .feed-time {
      font-size: 10px;
      font-weight: 600;
      color: rgba(255,255,255,0.6);
      font-variant-numeric: tabular-nums;
    }

    .feed-bar-track {
      width: 42px;
      height: 3px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px;
      overflow: hidden;
    }

    .feed-bar-fill {
      height: 100%;
      border-radius: 2px;
      background: #4a6fa5;
      transition: width 0.3s ease;
    }

    /* Group divider in feed */
    .feed-divider {
      padding: 5px 14px 2px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.28);
    }

    .feed-loading {
      padding: 24px 14px;
      font-size: 11px;
      color: rgba(255,255,255,0.4);
    }

    /* ─── Feed Sections (collapsible) ──────────────────── */
    .feed-section {
      flex-shrink: 0;
    }

    /* Space Weather Alerts */
    #fs-swx { border-bottom: 1px solid rgba(255,255,255,0.06); }
    #fsb-swx { overflow-y: auto; max-height: 230px; }
    #fsb-swx::-webkit-scrollbar { width: 4px; }
    #fsb-swx::-webkit-scrollbar-track { background: transparent; }
    #fsb-swx::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    /* Best Objects Today — natural block height */
    #fsb-ranking .feed-list { overflow: visible; }

    /* Sky Alerts */
    #fs-sky { border-top: 1px solid rgba(255,255,255,0.06); }
    #fsb-sky { overflow-y: auto; max-height: 230px; }
    #fsb-sky::-webkit-scrollbar { width: 4px; }
    #fsb-sky::-webkit-scrollbar-track { background: transparent; }
    #fsb-sky::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    .feed-section.is-collapsed .feed-section-body { display: none !important; }

    .feed-section-hdr {
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      border-bottom: 1px solid rgba(255,255,255,0.05);
      user-select: none;
      transition: color 0.15s;
      flex-shrink: 0;
    }
    .feed-section-hdr:hover { color: rgba(255,255,255,0.65); }
    .fsh-title { flex: 1; }
    .fsh-badge {
      font-size: 9px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 8px;
      background: rgba(244,67,54,0.2);
      color: #f44336;
      letter-spacing: 0.03em;
      display: none;
    }
    .fsh-chevron {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      font-size: 13px;
      border-radius: 5px;
      background: rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.75);
      transition: transform 0.2s, background 0.15s, color 0.15s;
      flex-shrink: 0;
    }
    .feed-section-hdr:hover .fsh-chevron {
      background: rgba(255,255,255,0.18);
      color: #fff;
    }
    .feed-section.is-collapsed .fsh-chevron { transform: rotate(-90deg); }

    /* ─── Alerts in left panel ──────────────────────────── */
    .alerts-list { padding: 4px 0; }
    .alert-item {
      display: grid;
      grid-template-columns: 28px 1fr auto;
      align-items: start;
      gap: 7px;
      padding: 7px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .alert-badge {
      font-size: 9px;
      font-weight: 800;
      text-align: center;
      padding: 3px 0;
      border-radius: 4px;
      line-height: 1.3;
      letter-spacing: 0.02em;
      margin-top: 1px;
    }
    .alert-sev-1 .alert-badge { color: #ffcc02; background: rgba(255,204,2,0.1); }
    .alert-sev-2 .alert-badge { color: #ff9800; background: rgba(255,152,0,0.12); }
    .alert-sev-3 .alert-badge { color: #ff5722; background: rgba(255,87,34,0.15); }
    .alert-sev-4 .alert-badge { color: #f44336; background: rgba(244,67,54,0.18); }
    .alert-sev-5 .alert-badge { color: #e040fb; background: rgba(224,64,251,0.15); }
    .alert-info { min-width: 0; }
    .alert-title {
      font-size: 11px;
      font-weight: 600;
      color: rgba(255,255,255,0.82);
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .alert-sub {
      font-size: 10px;
      color: rgba(255,255,255,0.5);
      margin-top: 2px;
      line-height: 1.35;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .alert-time-col {
      font-size: 10px;
      color: rgba(255,255,255,0.38);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      padding-top: 1px;
      flex-shrink: 0;
    }
    .alerts-empty {
      padding: 16px 14px;
      font-size: 11px;
      color: rgba(255,255,255,0.4);
    }
    /* Sky alert group colors */
    .sky-risk .alert-badge  { color: #f44336; background: rgba(244,67,54,0.15); }
    .sky-neo .alert-badge   { color: #42a5f5; background: rgba(66,165,245,0.12); }
    .sky-tran .alert-badge  { color: #ab47bc; background: rgba(171,71,188,0.13); }
    .sky-nova .alert-badge  { color: #ffee58; background: rgba(255,238,88,0.11); }
    /* Calendar event category colors */
    .cal-comets .alert-badge       { color: #26c6da; background: rgba(38,198,218,0.12); }
    .cal-eclipses .alert-badge     { color: #ffd54f; background: rgba(255,213,79,0.11); }
    .cal-meteors .alert-badge      { color: #ff8a65; background: rgba(255,138,101,0.12); }
    .cal-occultations .alert-badge { color: #ba68c8; background: rgba(186,104,200,0.12); }
    .cal-conjunctions .alert-badge { color: #81c784; background: rgba(129,199,132,0.11); }
    /* News category colors */
    .news-science .alert-badge    { color: #42a5f5; background: rgba(66,165,245,0.12); }
    .news-news .alert-badge       { color: #66bb6a; background: rgba(102,187,106,0.11); }
    .news-nebulacast .alert-badge { color: #ce93d8; background: rgba(206,147,216,0.12); }
    .news-images .alert-badge     { color: #26c6da; background: rgba(38,198,218,0.11); }
    .news-videos .alert-badge     { color: #ff8a65; background: rgba(255,138,101,0.12); }
    /* Calendar & News section scroll */
    #fs-cal, #fs-news { border-top: 1px solid rgba(255,255,255,0.06); }
    #fsb-cal, #fsb-news { overflow-y: auto; max-height: 230px; }
    #fsb-cal::-webkit-scrollbar,
    #fsb-news::-webkit-scrollbar  { width: 4px; }
    #fsb-cal::-webkit-scrollbar-track,
    #fsb-news::-webkit-scrollbar-track { background: transparent; }
    #fsb-cal::-webkit-scrollbar-thumb,
    #fsb-news::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    /* ─── Context Tools ──────────────────────────────────── */
    .console-tools {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
      flex: 1;
    }

    .tools-tabs {
      display: flex;
      gap: 2px;
      padding: 8px 16px 0;
      background: rgba(14, 18, 28, 0.97);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
    }

    .tools-tab {
      padding: 6px 14px 8px;
      font-size: 12px;
      font-weight: 500;
      color: rgba(255,255,255,0.55);
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
      margin-bottom: -1px;
    }

    .tools-tab:hover {
      color: rgba(255,255,255,0.85);
    }

    .tools-tab.is-active {
      color: #fff;
      border-bottom-color: #4a6fa5;
    }

    .tools-content {
      flex: 1;
      overflow: hidden;
      position: relative;
      min-height: 0;
    }

    .tools-panel {
      display: none;
      height: 100%;
      overflow: auto;
    }

    .tools-panel.is-active {
      display: block;
    }

    /* Weather panel needs padding */
    #panel-weather {
      padding: 0;
    }

    #panel-weather > #w-weather {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Sky panel – fullscreen canvas */
    #panel-sky {
      padding: 0;
      overflow: hidden;
    }

    #w-sky {
      width: 100%;
      height: 100%;
      background: #0a0e14;
      position: relative;
    }

    #skyMount {
      width: 100%;
      height: 100%;
      position: relative;
    }

    #skyMount .sky-root {
      position: relative !important;
      width: 100% !important;
      height: 100% !important;
      max-width: 100% !important;
      max-height: 100% !important;
      overflow: hidden !important;
    }

    :fullscreen .sky-root,
    .sky-root:fullscreen {
      position: fixed !important;
      width: 100vw !important;
      height: 100vh !important;
      max-width: none !important;
      max-height: none !important;
      top: 0 !important;
      left: 0 !important;
      background: #000 !important;
      overflow: visible !important;
    }

    /* Sun panel */
    #panel-sun {
      padding: 20px;
    }

    #w-sun { max-width: 1200px; margin: 0 auto; }

    /* Map panel */
    #panel-map {
      padding: 0;
      overflow: hidden;
    }

    .map-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Helio panel */
    #panel-helio {
      padding: 0;
    }

    #w-helio { max-width: 1100px; margin: 0 auto; padding: 20px; }

    /* Events panel */
    #panel-events {
      overflow: auto;
    }

    .events-subtabs {
      display: flex;
      gap: 2px;
      padding: 10px 20px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      position: sticky;
      top: 0;
      background: #0a0e14;
      z-index: 2;
    }

    .events-subtab {
      padding: 5px 12px 7px;
      font-size: 12px;
      font-weight: 500;
      color: rgba(255,255,255,0.55);
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: all 0.15s;
      margin-bottom: -1px;
    }

    .events-subtab:hover { color: rgba(255,255,255,0.85); }
    .events-subtab.is-active { color: #fff; border-bottom-color: #4a6fa5; }

    .events-subpanel { display: none; padding: 16px 20px; }
    .events-subpanel.is-active { display: block; }

    /* Observer weather in events */
    #w-observer-weather { max-width: 1200px; margin: 0 auto; }

<script src="https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.js"></script>

<!-- Main app: state, widgets, console logic -->
<script type="module">
  import { initState, getState, setState, subscribe } from "/weather/core/state.js";
  import { mountLocation } from "/weather/widgets/location/location.js";
  import { mountWeather } from "/weather/widgets/weather/weather.js";
  import { mountSunMoon } from "/weather/widgets/sun_moon/sun_moon.js";

  // ── State ──────────────────────────────────────────────
  initState();
  const storeApi = { getState, setState, subscribe };

  // ── Topbar: Location ────────────────────────────────────
  const locationEl = document.getElementById("w-location");
  if (locationEl) mountLocation(locationEl, storeApi);

  // ── Weather (Conditions tab) ────────────────────────────
  const weatherEl = document.getElementById("w-weather");
  if (weatherEl) mountWeather(weatherEl, storeApi);

  // ── Sun & Moon tab ──────────────────────────────────────
  const sunEl = document.getElementById("w-sun");
  if (sunEl) mountSunMoon(sunEl, storeApi);

  // ── Calendar & News (always init, DOM ready) ────────────
  window.runCalendarWidget({
    rootId:   'nrc-main',
    jsonUrl:  '/calendar/daily_signal.json',
    maxItems: 25,
    filters:  ["All", "METEORS", "ECLIPSES", "CONJUNCTIONS", "OCCULTATIONS", "COMETS"],
    iconBase: '/assets/icons/alerts'
  });

  window.runNewsWidget({
    rootId:   'nrw-main',
    rssUrl:   '/news/rss.xml',
    maxItems: 15,
    parseMax: 300,
    filters:  ["All", "News", "Science", "Videos", "Images", "Nebulacast"]
  });

  // ── Observer Weather (lazy – inside Events tab) ─────────
  let obsInited = false;
  function initObsIfNeeded() {
    if (obsInited) return;
    obsInited = true;
    const obsEl = document.getElementById('w-observer-weather');
    if (obsEl && window.runObserverWeatherPanel) {
      window.runObserverWeatherPanel(obsEl, { jsonUrl: '/data/observer_weather_now.json' });
    }
  }

  // ── Helio (lazy – Space Weather tab) ───────────────────
  let helioInited = false;
  let _helioInstance = null;
  function initHelioIfNeeded() {
    if (helioInited) return;
    helioInited = true;
    const helioEl = document.getElementById('w-helio');
    if (helioEl && window.HelioWidget) {
      const loc = getState()?.location ?? {};
      _helioInstance = window.HelioWidget.mount(helioEl, {
        dataUrl:      '/data/helio_now.json',
        lat:          typeof loc.lat === 'number' ? loc.lat : undefined,
        lon:          typeof loc.lon === 'number' ? loc.lon : undefined,
        locationName: loc.name || undefined,
      });
    }
  }

  subscribe((newState) => {
    const loc = newState?.location;
    if (_helioInstance && loc) {
      _helioInstance.updateLocation(
        typeof loc.lat === 'number' ? loc.lat : undefined,
        typeof loc.lon === 'number' ? loc.lon : undefined,
        loc.name || undefined
      );
    }
  });

  // ── Map (lazy iframe) ───────────────────────────────────
  let mapInited = false;
  function initMapIfNeeded() {
    if (mapInited) return;
    mapInited = true;
    const iframe = document.getElementById("mapIframe");
    if (!iframe) return;
    iframe.src = "/weather/map-poc.html";
    iframe.addEventListener('load', () => {
      try {
        const doc = iframe.contentDocument || iframe.contentWindow.document;
        const s = doc.createElement('style');
        s.textContent = `.page-wrap{max-width:none!important;width:100%!important;padding:12px!important}#map{height:calc(100vh - 250px)!important}.card,.map-wrapper,#map{border-radius:0!important}`;
        doc.head.appendChild(s);
      } catch (_) {}
      const loc = getState()?.location;
      if (loc && iframe.contentWindow) {
        iframe.contentWindow.postMessage({ type: "update-location", location: loc }, "*");
      }
    });
    subscribe(() => {
      const loc = getState()?.location;
      if (loc && iframe.contentWindow && iframe.src) {
        iframe.contentWindow.postMessage({ type: "update-location", location: loc }, "*");
      }
    });
  }

  // ── Sky (lazy) ──────────────────────────────────────────
  let skyInited = false;

  function clampMs(t, a, b) { return Math.max(a, Math.min(b, t)); }

  function pickLatLon(s) {
    const lat = s?.location?.lat ?? s?.loc?.lat ?? s?.coords?.lat ?? null;
    const lon = s?.location?.lon ?? s?.location?.lng ?? s?.loc?.lon ?? s?.loc?.lng ?? s?.coords?.lon ?? s?.coords?.lng ?? null;
    return {
      lat: (typeof lat === 'number' && isFinite(lat)) ? lat : null,
      lon: (typeof lon === 'number' && isFinite(lon)) ? lon : null,
    };
  }

  function pickDatetimeISO(s) {
    const v = s?.time?.datetimeISO ?? s?.time?.iso ?? s?.controls?.datetimeISO ?? s?.selectedTimeISO ?? null;
    if (typeof v === 'string' && v.trim()) return v.trim();
    return null;
  }

  async function initSkyIfNeeded() {
    if (skyInited) return;
    skyInited = true;

    const css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = '/sky/assets/sky.css';
    document.head.appendChild(css);

    const state = getState();
    const { lat, lon } = pickLatLon(state);
    const now = Date.now();
    const max = now + 7 * 24 * 60 * 60 * 1000;
    let dtISO = pickDatetimeISO(state);
    if (dtISO) {
      const t = Date.parse(dtISO);
      dtISO = isFinite(t) ? new Date(clampMs(t, now, max)).toISOString() : null;
    }

    window.SKY_CONFIG = {
      baseUrl:     '/sky',
      mountId:     'skyMount',
      lat:         (lat != null ? lat : 52.2297),
      lon:         (lon != null ? lon : 21.0122),
      datetimeISO: dtISO,
      options: {
        showSunMoon:       true,
        showMilkyWay:      true,
        showGridEq:        true,
        showConstellations: true,
        showObjects:       true,
        showAlerts:        true,
      }
    };

    await import('/sky/widget.js');
    setTimeout(() => { try { window.__skyWidget?.resize?.(); } catch (_) {} }, 0);
  }

  function syncSkyFromState() {
    if (!window.__skyWidget || typeof window.__skyWidget.update !== 'function') return;
    const s = getState();
    const { lat, lon } = pickLatLon(s);
    const now = Date.now(), max = now + 7 * 24 * 60 * 60 * 1000;
    let dtISO = pickDatetimeISO(s);
    if (dtISO) {
      const t = Date.parse(dtISO);
      dtISO = isFinite(t) ? new Date(clampMs(t, now, max)).toISOString() : null;
    }
    const patch = {};
    if (lat != null) patch.lat = lat;
    if (lon != null) patch.lon = lon;
    patch.datetimeISO = dtISO;
    try { window.__skyWidget.update(patch); } catch (_) {}
  }

  subscribe(() => { if (skyInited) syncSkyFromState(); });

  // ── Context Tools tab switching ─────────────────────────
  const toolTabs    = document.querySelectorAll('.tools-tab');
  const toolPanels  = document.querySelectorAll('.tools-panel');

  toolTabs.forEach(tab => {
    tab.addEventListener('click', () => {
      const id = tab.dataset.tab;

      // Lazy-init heavy panels
      if (id === 'sky')    { initSkyIfNeeded().then(() => { syncSkyFromState(); setTimeout(() => { try { window.__skyWidget?.resize?.(); } catch (_) {} }, 100); }); }
      if (id === 'map')    { initMapIfNeeded(); }
      if (id === 'helio')  { initHelioIfNeeded(); }
      if (id === 'events') { initObsIfNeeded(); }

      toolTabs.forEach(t => t.classList.remove('is-active'));
      tab.classList.add('is-active');

      toolPanels.forEach(p => p.classList.toggle('is-active', p.id === `panel-${id}`));

      const titles = { weather: 'Conditions', sky: 'Sky', sun: 'Sun & Moon', map: 'Map', helio: 'Space Weather', events: 'Events' };
      document.title = `Nebulacast — ${titles[id] || id}`;
    });
  });

  // ── Events sub-tabs ─────────────────────────────────────
  const subTabs   = document.querySelectorAll('.events-subtab');
  const subPanels = document.querySelectorAll('.events-subpanel');

  subTabs.forEach(tab => {
    tab.addEventListener('click', () => {
      if (tab.dataset.sub === 'observer') initObsIfNeeded();
      subTabs.forEach(t => t.classList.remove('is-active'));
      tab.classList.add('is-active');
      subPanels.forEach(p => p.classList.toggle('is-active', p.id === `subpanel-${tab.dataset.sub}`));
    });
  });

  // ══════════════════════════════════════════════════════════
  //  NIGHT OVERVIEW PANEL
  // ══════════════════════════════════════════════════════════

  // Preload moon bitmap
  const _moonImg = new Image();
  _moonImg.src = '/assets/bitmaps/Moon.png';

  // Module state for interactive NOP elements
  let _nopProfiles = {}, _nopActiveProfile = 'balanced';
  let _nopNightHours = [], _nopBestWindow = null, _nopActiveMetric = 'cloud';
  let _nopNQI = {};       // night_summary.nqi  per profile: {value, class}
  let _nopAvgScore = {};  // night_summary.avg_score per profile: int 0-100

  function _nopScoreCls(s) { return s>=85?'score-excellent':s>=70?'score-good':s>=50?'score-fair':'score-poor'; }
  function _nopScoreLbl(s) { return s>=85?'Excellent':s>=70?'Good':s>=50?'Fair':'Poor'; }
  function _nopScoreColor(s) { return s>=85?'#4caf50':s>=70?'#8bc34a':s>=50?'#ff9800':'#f44336'; }

  // NQI helpers (0–10 scale)
  function _nqiColor(cls) {
    return cls==='excellent'?'#4caf50':cls==='good'?'#8bc34a':cls==='usable'?'#ff9800':cls==='marginal'?'#f44336':'#9e3a3a';
  }
  function _nqiLabel(cls) { return cls ? cls.charAt(0).toUpperCase()+cls.slice(1) : '—'; }
  function _nopFmtT(iso)   { try { return new Date(iso).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false}); } catch(_){return'—';} }

  // Parse "2026-Mar-30 07:06Z" format from sun_moon.json
  function _parseSMTime(s) {
    const MO = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
    const m = s && s.match(/^(\d{4})-(\w{3})-(\d{2})\s+(\d{2}):(\d{2})Z?$/);
    if (!m) return null;
    return new Date(Date.UTC(+m[1], MO[m[2]]||0, +m[3], +m[4], +m[5]));
  }

  // illum: 0..1 (illumination fraction), waxing: true/false
  function _nopDrawMoon(canvas, illum, waxing) {
    if (!canvas) return;
    const size = canvas.width, r = size/2 - 1, cx = size/2, cy = size/2;
    const ctx = canvas.getContext('2d');

    const render = () => {
      ctx.clearRect(0, 0, size, size);

      // Step 1: draw bitmap clipped to circle (lit side stays at full brightness)
      ctx.save();
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.clip();
      ctx.drawImage(_moonImg, cx-r, cy-r, r*2, r*2);
      ctx.restore();

      // Full moon — no shadow needed
      if (illum > 0.98) return;

      // Step 2: build shadow shape on offscreen canvas, then stamp it over bitmap
      // Terminator semi-minor axis: ex = r * cos(π * illum)
      //   illum=0   → ex= r  → full shadow
      //   illum=0.5 → ex= 0  → straight line (quarter)
      //   illum=1   → ex=-r  → no shadow (full)
      const ex = r * Math.cos(Math.PI * illum);

      // Shadow offscreen
      const os = document.createElement('canvas');
      os.width = size; os.height = size;
      const oc = os.getContext('2d');
      oc.fillStyle = 'rgba(4,8,20,0.93)';

      if (illum < 0.02) {
        // New moon: full disk shadow
        oc.beginPath(); oc.arc(cx, cy, r, 0, Math.PI*2); oc.fill();
      } else if (waxing) {
        // Waxing: right side lit → shadow on LEFT semicircle
        oc.beginPath();
        oc.moveTo(cx, cy - r);
        oc.arc(cx, cy, r, -Math.PI/2, Math.PI/2, true); // left half CCW
        oc.closePath();
        oc.fill();
        if (ex > 0) {
          // Crescent: terminator bulges right → shadow also covers part of right
          oc.beginPath(); oc.ellipse(cx, cy, ex, r, 0, 0, Math.PI*2); oc.fill();
        } else if (ex < 0) {
          // Gibbous: terminator bulges left → cut ellipse from left shadow
          oc.globalCompositeOperation = 'destination-out';
          oc.beginPath(); oc.ellipse(cx, cy, -ex, r, 0, 0, Math.PI*2); oc.fill();
        }
      } else {
        // Waning: left side lit → shadow on RIGHT semicircle
        oc.beginPath();
        oc.moveTo(cx, cy - r);
        oc.arc(cx, cy, r, -Math.PI/2, Math.PI/2, false); // right half CW
        oc.closePath();
        oc.fill();
        if (ex > 0) {
          // Crescent: terminator bulges left → shadow also covers part of left
          oc.beginPath(); oc.ellipse(cx, cy, ex, r, 0, 0, Math.PI*2); oc.fill();
        } else if (ex < 0) {
          // Gibbous: terminator bulges right → cut ellipse from right shadow
          oc.globalCompositeOperation = 'destination-out';
          oc.beginPath(); oc.ellipse(cx, cy, -ex, r, 0, 0, Math.PI*2); oc.fill();
        }
      }

      // Step 3: clip shadow to disk, then draw over bitmap
      const mask = document.createElement('canvas');
      mask.width = size; mask.height = size;
      const mc = mask.getContext('2d');
      mc.beginPath(); mc.arc(cx, cy, r, 0, Math.PI*2);
      mc.fillStyle = '#000'; mc.fill();
      mc.globalCompositeOperation = 'source-in';
      mc.drawImage(os, 0, 0);
      ctx.drawImage(mask, 0, 0);
    };

    if (_moonImg.complete && _moonImg.naturalWidth) {
      render();
    } else {
      _moonImg.onload = render;
    }
  }

  function _nopRenderChart(metric) {
    const chart = document.getElementById('nop-chart');
    if (!chart) return;
    if (!_nopNightHours.length) { chart.innerHTML = ''; return; }

    const m = _NOP_METRICS[metric] || _NOP_METRICS.cloud;
    const vals = _nopNightHours.map(h => m.get(h));
    const defined = vals.filter(v => v != null);

    let minV = m.fixMin ?? (defined.length ? Math.min(...defined) : 0);
    let maxV = m.fixMax ?? (defined.length ? Math.max(...defined) : 1);
    // Ensure minimum visible range
    if (maxV - minV < 1) { const mid=(maxV+minV)/2; minV=mid-1; maxV=mid+1; }

    const MAX_H = 40;
    chart.innerHTML = _nopNightHours.map((h, i) => {
      const val = vals[i];
      const norm = val != null ? Math.max(0, Math.min(1, (val - minV) / (maxV - minV))) : null;
      const hpx  = norm != null ? Math.max(3, Math.round(norm * MAX_H)) : 3;
      const inWin = _nopBestWindow && h.timestamp_utc &&
        h.timestamp_utc >= _nopBestWindow.start && h.timestamp_utc < _nopBestWindow.end;
      const bg = inWin ? m.hiColor : m.color;
      const timeStr = _nopFmtT(h.timestamp_utc);
      const valStr  = val != null ? m.fmt(val) : '—';
      return `<div class="nop-bar" style="height:${hpx}px;background:${bg}"
        data-tip="${timeStr}: ${valStr}"></div>`;
    }).join('');

    // Attach tooltip behaviour on first render
    if (!chart._tipBound) {
      chart._tipBound = true;
      const tip = document.getElementById('nop-tooltip');
      chart.addEventListener('mouseover', e => {
        const bar = e.target.closest('.nop-bar');
        if (!bar || !tip) return;
        tip.textContent = bar.dataset.tip || '';
        tip.style.display = 'block';
      });
      chart.addEventListener('mousemove', e => {
        if (!tip) return;
        tip.style.left = (e.clientX + 10) + 'px';
        tip.style.top  = (e.clientY - 28) + 'px';
      });
      chart.addEventListener('mouseleave', () => { if (tip) tip.style.display = 'none'; });
    }
  }

  async function loadHero() {
    const hero = document.getElementById('console-hero');
    if (!hero) return;

    let wx = null, sw = null, sunMoon = null;
    try {
      [wx, sw, sunMoon] = await Promise.all([
        fetch('/data/observer_weather_now.json', {cache:'no-store'}).then(r => r.ok ? r.json() : null),
        fetch('/data/helio_now.json').then(r => r.ok ? r.json() : null),
        fetch('/sky/data/sun_moon.json').then(r => r.ok ? r.json() : null),
      ]);
    } catch (_) {}

    // ── Night hours — first continuous block only (sunset → sunrise) ──
    _nopNightHours = [];
    let _inNight = false;
    for (const h of (wx?.hourly || [])) {
      if (h.night === true)  { _inNight = true; _nopNightHours.push(h); }
      else if (_inNight)     { break; } // first night ended
    }
    _nopBestWindow = wx?.decision?.best_tonight || null;

    // ── Profile scores & NQI ──
    _nopProfiles = wx?.decision?.mode_scores || {};
    _nopNQI      = wx?.night_summary?.nqi        || {};
    _nopAvgScore = wx?.night_summary?.avg_score   || {};
    const profileKeys = Object.keys(_nopProfiles).length
      ? Object.keys(_nopProfiles)
      : Object.keys(_nopNQI);
    if (profileKeys.length && !(_nopProfiles[_nopActiveProfile] || _nopNQI[_nopActiveProfile]))
      _nopActiveProfile = profileKeys[0];

    // ── Sun/moon crossings from sun_moon.json ──
    let sunsetT = null, sunriseT = null, moonriseT = null, moonsetT = null;
    let moonIllum = wx?.moon?.illumination_percent ?? 0, moonWaxing = true;

    if (sunMoon?.frames?.length) {
      const frames = sunMoon.frames;
      const now = Date.now();
      const scanStart = now - 8 * 3600e3, scanEnd = now + 32 * 3600e3;

      for (let i = 1; i < frames.length; i++) {
        const t = _parseSMTime(frames[i].t_utc);
        if (!t) continue;
        const ms = t.getTime();
        if (ms < scanStart || ms > scanEnd) continue;
        const prevS = frames[i-1].sun?.alt_deg ?? 0, currS = frames[i].sun?.alt_deg ?? 0;
        if (prevS > 0 && currS <= 0 && !sunsetT)               sunsetT  = t.toISOString();
        if (prevS <= 0 && currS > 0 && sunsetT && !sunriseT)   sunriseT = t.toISOString();
      }
      // Moon crossings around tonight
      const nightS = sunsetT  ? new Date(sunsetT).getTime()  - 2*3600e3 : now;
      const nightE = sunriseT ? new Date(sunriseT).getTime() + 2*3600e3 : now + 14*3600e3;
      for (let i = 1; i < frames.length; i++) {
        const t = _parseSMTime(frames[i].t_utc);
        if (!t) continue;
        const ms = t.getTime();
        if (ms < nightS || ms > nightE) continue;
        const prevM = frames[i-1].moon?.alt_deg ?? 0, currM = frames[i].moon?.alt_deg ?? 0;
        if (prevM <= 0 && currM > 0 && !moonriseT) moonriseT = t.toISOString();
        if (prevM > 0 && currM <= 0 && !moonsetT)  moonsetT  = t.toISOString();
      }
      // Moon phase at nearest frame to now
      let closest = null, minD = Infinity;
      for (const f of frames) {
        const t = _parseSMTime(f.t_utc); if (!t) continue;
        const d = Math.abs(t.getTime() - now);
        if (d < minD) { minD = d; closest = f; }
      }
      if (closest?.moon) {
        if (!moonIllum) moonIllum = closest.moon.illum_pct ?? 0;
        moonWaxing = closest.moon.waxing !== false; // default true
      }
    }

    // ── Text summary ──
    function buildSummary() {
      if (!_nopNightHours.length) return 'Weather data unavailable for tonight.';
      const cloudAvg = _nopNightHours.reduce((s,h) => s+(h.cloud?.total_percent||0), 0) / _nopNightHours.length;
      const windMax  = Math.max(..._nopNightHours.map(h => h.wind?.speed_mps||0));
      const hasPrecip = _nopNightHours.some(h => (h.precip?.probability_percent||0) > 30);
      const dewRisk  = wx?.decision?.risks?.dew || 'low';
      const s1 = cloudAvg < 20 ? 'Clear skies expected throughout the night.' :
                 cloudAvg < 40 ? 'Mostly clear with occasional cloud patches.' :
                 cloudAvg < 60 ? 'Partly cloudy — some patches will affect views.' :
                 cloudAvg < 80 ? 'Significant cloud cover will limit observations.' :
                                 'Heavy overcast. Observing not recommended.';
      const s2 = hasPrecip     ? 'Precipitation possible, limiting clear windows.' :
                 windMax > 10  ? `Winds up to ${Math.round(windMax*3.6)} km/h may affect stability.` :
                 dewRisk==='high' ? 'High dew risk — protect optics.' :
                 cloudAvg < 30 ? 'Conditions are favorable for most observations.' :
                                 'Observing windows will be limited.';
      const s3 = (sw?.summary?.status==='storm'||sw?.summary?.status==='active')
        ? 'Elevated geomagnetic activity may affect radio observations.' : '';
      return [s1, s2, s3].filter(Boolean).join(' ');
    }

    // ── Panel 1: Space Weather ──
    const kp = sw?.metrics?.kp_latest ?? null;
    const scales = sw?.scales || {};
    const gLvl = parseInt((scales.g_scale||'G0').replace(/\D/g,'')) || 0;
    const rLvl = parseInt((scales.r_scale||'R0').replace(/\D/g,'')) || 0;
    const sLvl = parseInt((scales.s_scale||'S0').replace(/\D/g,'')) || 0;
    const trend = sw?.forecast?.trend || 'steady';
    const trendArrow = trend==='rising'?'↑':trend==='falling'?'↓':'→';
    const swStatus = sw?.summary?.status || 'quiet';
    const swLabel  = sw?.summary?.label  || 'Quiet';
    function scaleBadge(l, lvl, max) {
      const on = lvl > 0;
      const hi = lvl / max;
      const c  = !on?'rgba(255,255,255,0.2)':hi>=0.6?'#f44336':'#ff9800';
      const bg = !on?'rgba(255,255,255,0.05)':hi>=0.6?'rgba(244,67,54,0.15)':'rgba(255,152,0,0.13)';
      return `<span class="nop-scale-badge" style="color:${c};background:${bg}">${l}${lvl}</span>`;
    }
    const p1 = `<div class="hero-card" style="min-width:118px;flex-shrink:0">
      <div class="hero-card-label">Kp</div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px">
        <div style="display:flex;align-items:baseline;gap:6px">
          <span style="font-size:38px;font-weight:700;line-height:1;color:#fff">${kp!=null?kp.toFixed(1):'—'}</span>
          <span style="font-size:20px;color:rgba(255,255,255,0.55);line-height:1">${trendArrow}</span>
        </div>
        <div><span class="sw-badge ${swStatus}">${swLabel}</span></div>
        <div style="font-size:9px;color:rgba(255,255,255,0.3)">Current conditions</div>
      </div>
      <div class="nop-scales" style="margin-top:auto">${scaleBadge('G',gLvl,5)}${scaleBadge('R',rLvl,5)}${scaleBadge('S',sLvl,5)}</div>
    </div>`;

    // ── Panel 2: Sun ──
    // Kp → glow border colour, same mapping as helio widget STATUS_TONE
    const kpNum = kp ?? 0;
    const sunBorder = kpNum>=6?'#e05c5c':kpNum>=5?'#e0a84a':kpNum>=4?'#d4cc5c':'#5cce8c';
    const p2 = `<div class="hero-card" style="min-width:110px;flex-shrink:0;align-items:center">
      <div class="hero-card-label" style="align-self:flex-start">Sun</div>
      <div style="flex:1;display:flex;align-items:center;justify-content:center">
        <div style="position:relative;width:86px;height:86px;border-radius:50%;overflow:hidden;
                    border:1px solid ${sunBorder}44;background:#0a0a0a;flex-shrink:0;
                    box-shadow:0 0 10px ${sunBorder}55,0 0 24px ${sunBorder}22">
          <img src="/assets/gifs/current_eit_304.gif" alt="Sun EIT 304"
               style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;object-position:center">
        </div>
      </div>
      <div style="font-size:10px;color:rgba(255,255,255,0.5);white-space:nowrap">↓ ${_nopFmtT(sunsetT)} &nbsp; ↑ ${_nopFmtT(sunriseT)}</div>
    </div>`;

    // ── Panel 3: Night Summary ──
    const p3 = `<div class="hero-card" style="flex:1;min-width:155px;max-width:255px">
      <div class="hero-card-label">Tonight</div>
      <div class="nop-summary-text">${buildSummary()}</div>
    </div>`;

    // ── Panel 4: Moon ──
    const moonUpStr = wx?.moon?.moon_up_now===true
      ? '<span style="color:#ff9800;font-size:9px"> ↑up</span>'
      : wx?.moon?.moon_up_now===false
        ? '<span style="color:rgba(255,255,255,0.22);font-size:9px"> ↓below</span>' : '';
    const moonRiseSet = (moonriseT||moonsetT)
      ? `<div style="font-size:9px;color:rgba(255,255,255,0.38);margin-top:2px">${moonriseT?'↑'+_nopFmtT(moonriseT):''}${moonriseT&&moonsetT?' ':''  }${moonsetT?'↓'+_nopFmtT(moonsetT):''}</div>` : '';
    const p4 = `<div class="hero-card" style="min-width:110px;flex-shrink:0;align-items:center">
      <div class="hero-card-label" style="align-self:flex-start">Moon</div>
      <div style="flex:1;display:flex;align-items:center;justify-content:center">
        <canvas id="nop-moon-canvas" width="72" height="72" style="flex-shrink:0;width:72px;height:72px"></canvas>
      </div>
      <div style="font-size:10px;color:rgba(255,255,255,0.5);white-space:nowrap">${Math.round(moonIllum)}% &nbsp;${moonriseT?'↑'+_nopFmtT(moonriseT):''}${moonriseT&&moonsetT?' ':''}${moonsetT?'↓'+_nopFmtT(moonsetT):''}</div>
    </div>`;

    // ── Panel 5: Night Quality (NQI) ──
    const PLBL = { balanced:'Balanced', visual:'Visual', photography:'Photo', broadband:'Broadband', planetary:'Planetary' };
    const profileBtns = profileKeys.map(k =>
      `<button class="nop-profile-btn${k===_nopActiveProfile?' is-active':''}" data-profile="${k}">${PLBL[k]||k}</button>`
    ).join('');
    const activeNqi  = _nopNQI[_nopActiveProfile] || {};
    const nqiVal     = activeNqi.value != null ? activeNqi.value.toFixed(1) : '—';
    const nqiCls     = activeNqi.class || 'poor';
    const nqiClr     = _nqiColor(nqiCls);
    const nqiAvgTxt  = (_nopAvgScore[_nopActiveProfile] != null)
      ? `<span id="nop-nqi-avg" style="font-size:9px;color:rgba(255,255,255,0.28)">avg ${_nopAvgScore[_nopActiveProfile]}/100</span>` : '<span id="nop-nqi-avg"></span>';
    const p5 = `<div class="hero-card" style="min-width:165px;flex-shrink:0">
      <div class="hero-card-label">Night Quality</div>
      <div style="flex:1;display:flex;align-items:center;gap:10px;margin-top:4px">
        <div style="flex-shrink:0;display:flex;align-items:baseline;gap:3px">
          <span id="nop-nqi-val" style="font-size:48px;font-weight:700;line-height:1;color:${nqiClr}">${nqiVal}</span>
          <span style="font-size:14px;color:rgba(255,255,255,0.3);font-weight:500">/10</span>
        </div>
        <div class="nop-profiles" style="flex:1">${profileBtns}</div>
      </div>
      <div style="display:flex;align-items:baseline;gap:5px">
        <span id="nop-nqi-lbl" class="hero-card-sub" style="color:${nqiClr}">${_nqiLabel(nqiCls)}</span>
        ${nqiAvgTxt}
      </div>
    </div>`;

    // ── Panel 6: Best Observing Window ──
    const bw = _nopBestWindow;
    const winStr = bw ? `${_nopFmtT(bw.start)} – ${_nopFmtT(bw.end)}` : '— no data —';
    const chipKeys = ['cloud','dew','wind','pressure','temp'];
    const chipLabels = { cloud:'☁ Cloud', dew:'💧 Dew', wind:'💨 Wind', pressure:'⬆ Pressure', temp:'🌡 Temp' };
    const chipBtns = chipKeys.map(k =>
      `<button class="nop-chip${_nopActiveMetric===k?' is-active':''}" data-metric="${k}">${chipLabels[k]}</button>`
    ).join('');
    const p6 = `<div class="hero-card" style="flex:1;min-width:160px">
      <div class="hero-card-label">Best Window</div>
      <div class="nop-window-time">${winStr}</div>
      <div id="nop-chart" class="nop-bar-chart" style="margin-top:auto"></div>
      <div class="nop-chips">${chipBtns}</div>
    </div>`;

    hero.innerHTML = [p1, p2, p4, p5, p3, p6].join('');

    // Post-render
    _nopDrawMoon(document.getElementById('nop-moon-canvas'), moonIllum / 100, moonWaxing);
    _nopRenderChart(_nopActiveMetric);
  }

  const DSO_CLASS = {
    SG:'Galaxy', EG:'Galaxy', IG:'Galaxy', GG:'Galaxy', CG:'Galaxy',
    GC:'Glob. Cluster', OC:'Open Cluster',
    EN:'Em. Nebula', RN:'Refl. Nebula', PN:'Plan. Nebula', BN:'Dark Nebula', SNR:'SNR',
  };

  const TYPE_ICON = {
    planet: '🪐',
    dso:    '🌌',
    alert:  '⚠️',
    comet:  '☄️',
    star:   '⭐',
  };

  function fmtBestTime(iso) {
    if (!iso) return '—';
    try {
      return new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
    } catch (_) { return '—'; }
  }

  async function loadFeed() {
    const feedEl = document.getElementById('feed-list');
    if (!feedEl) return;

    let data = null;
    try { data = await fetch('/sky/data/ranking.json').then(r => r.ok ? r.json() : null); } catch (_) {}

    if (!data?.items?.length) {
      feedEl.innerHTML = '<div class="feed-loading">No targets available.</div>';
      return;
    }

    const items = data.items;
    const maxScore = items[0].score || 1;

    // Group items
    const groups = {};
    items.forEach(item => {
      const g = item.group || 'other';
      if (!groups[g]) groups[g] = [];
      groups[g].push(item);
    });

    const ORDER = ['alerts', 'calendar', 'planets', 'dso', 'other'];
    const GROUP_LABEL = { planets: 'Planets', dso: 'Deep Sky', alerts: 'Alerts', calendar: 'Events', other: 'Other' };

    let html = '';
    let rank = 1;
    for (const g of ORDER) {
      if (!groups[g]?.length) continue;
      html += `<div class="feed-divider">${GROUP_LABEL[g] || g}</div>`;
      for (const item of groups[g]) {
        const pct    = Math.round((item.score / maxScore) * 100);
        const icon   = TYPE_ICON[item.type] || TYPE_ICON[item.group] || '·';
        const time   = fmtBestTime(item.vis?.best_time_local_quality || item.vis?.best_time_local);
        const sub    = item.meta?.comment || DSO_CLASS[item.meta?.class] || item.type || '';
        const barW   = Math.max(5, pct);

        html += `
          <div class="feed-item" data-id="${item.id}" data-group="${g}" title="${item.name}${sub ? ' — '+sub : ''}">
            <div class="feed-rank">${rank}</div>
            <div class="feed-icon">${icon}</div>
            <div class="feed-info">
              <div class="feed-name">${item.name}</div>
              ${sub ? `<div class="feed-sub">${sub}</div>` : ''}
            </div>
            <div class="feed-score-col">
              <div class="feed-time">${time}</div>
              <div class="feed-bar-track"><div class="feed-bar-fill" style="width:${barW}%"></div></div>
            </div>
          </div>
        `;
        rank++;
      }
    }

    feedEl.innerHTML = html;

    // Click → open Sky tab focused on that object
    feedEl.querySelectorAll('.feed-item').forEach(el => {
      el.addEventListener('click', () => {
        // Switch to Sky tab
        document.querySelector('[data-tab="sky"]')?.click();
        // TODO: forward target ID to sky widget when supported
      });
    });
  }

  // ── Shared age formatter ────────────────────────────────
  function fmtAge(iso) {
    if (!iso) return '';
    try {
      const diff = (Date.now() - new Date(iso)) / 1000;
      if (diff < 3600) return `${Math.round(diff / 60)}m`;
      if (diff < 86400) return `${Math.round(diff / 3600)}h`;
      return `${Math.round(diff / 86400)}d`;
    } catch (_) { return ''; }
  }

  // ── Space Weather Alerts ────────────────────────────────
  async function loadSwxAlerts() {
    const list = document.getElementById('swx-list');
    const badge = document.getElementById('swx-badge');
    if (!list) return;

    let sw = null;
    try { sw = await fetch('/data/helio_now.json').then(r => r.ok ? r.json() : null); } catch (_) {}

    const alerts = (sw?.alerts_preview || []).slice(0, 8);
    if (!alerts.length) {
      list.innerHTML = '<div class="alerts-empty">No active alerts.</div>';
      return;
    }
    if (badge) { badge.textContent = alerts.length; badge.style.display = ''; }

    let html = '';
    for (const a of alerts) {
      const sev = Math.min(5, Math.max(1, a.severity || 1));
      const lbl = `${a.domain || '?'}${sev}`;
      const time = fmtAge(a.t_utc);
      const title = (a.title || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const sub = (a.summary_short || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      html += `<div class="alert-item alert-sev-${sev}">
        <div class="alert-badge">${lbl}</div>
        <div class="alert-info">
          <div class="alert-title">${title}</div>
          ${sub ? `<div class="alert-sub">${sub}</div>` : ''}
        </div>
        ${time ? `<div class="alert-time-col">${time}</div>` : ''}
      </div>`;
    }
    list.innerHTML = html;
  }

  // ── Sky Alerts ──────────────────────────────────────────
  async function loadSkyAlerts() {
    const list = document.getElementById('sky-list');
    const badge = document.getElementById('sky-badge');
    if (!list) return;

    let data = null;
    try { data = await fetch('/sky/data/alerts_now.json').then(r => r.ok ? r.json() : null); } catch (_) {}

    const items = (data?.items || []).slice(0, 10);
    if (!items.length) {
      list.innerHTML = '<div class="alerts-empty">No active alerts.</div>';
      return;
    }
    if (badge) { badge.textContent = items.length; badge.style.display = ''; }

    const GRP_LABEL = { risk: 'RISK', neo: 'NEO', neocp: 'NEO?', transient: 'TRAN', nova: 'NOVA' };
    const GRP_CLS   = { risk: 'sky-risk', neo: 'sky-neo', neocp: 'sky-neo', transient: 'sky-tran', nova: 'sky-nova' };

    let html = '';
    for (const a of items) {
      const grp = a.group || a.type || 'neo';
      const lbl = GRP_LABEL[grp] || grp.toUpperCase().slice(0, 4);
      const cls = GRP_CLS[grp] || 'sky-neo';
      const time = fmtAge(a.updated_utc || a.ingested_utc);
      const title = (a.title || a.id || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const note = (a.note || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const mag = a.mag != null ? `mag&nbsp;${a.mag.toFixed(1)}` : '';
      const sub = [note, mag].filter(Boolean).join(' · ');
      html += `<div class="alert-item ${cls}">
        <div class="alert-badge">${lbl}</div>
        <div class="alert-info">
          <div class="alert-title">${title}</div>
          ${sub ? `<div class="alert-sub">${sub}</div>` : ''}
        </div>
        ${time ? `<div class="alert-time-col">${time}</div>` : ''}
      </div>`;
    }
    list.innerHTML = html;
  }

  // ── Calendar Events ─────────────────────────────────────
  async function loadCalendarEvents() {
    const list = document.getElementById('cal-list');
    const badge = document.getElementById('cal-badge');
    if (!list) return;

    let data = null;
    try { data = await fetch('/calendar/daily_signal.json').then(r => r.ok ? r.json() : null); } catch (_) {}

    const items = (data?.items || []).slice(0, 20);
    if (!items.length) {
      list.innerHTML = '<div class="alerts-empty">No upcoming events.</div>';
      return;
    }
    if (badge) { badge.textContent = items.length; badge.style.display = ''; }

    const CAT_LABEL = { COMETS: 'CMT', ECLIPSES: 'ECL', METEORS: 'MTR', OCCULTATIONS: 'OCC', CONJUNCTIONS: 'CNJ' };
    const CAT_CLS   = { COMETS: 'cal-comets', ECLIPSES: 'cal-eclipses', METEORS: 'cal-meteors', OCCULTATIONS: 'cal-occultations', CONJUNCTIONS: 'cal-conjunctions' };

    // Sort by published_at ascending (nearest first)
    const sorted = [...items].sort((a, b) => {
      const da = a.published_at || '', db = b.published_at || '';
      return da < db ? -1 : da > db ? 1 : 0;
    });

    let html = '';
    for (const ev of sorted) {
      const cat = (ev.category || ev.stream || '').toUpperCase();
      const lbl = CAT_LABEL[cat] || cat.slice(0, 3);
      const cls = CAT_CLS[cat] || 'cal-conjunctions';
      // Strip leading date prefix like "02 Aug 2027 (490 days away): "
      const rawTitle = ev.title || '';
      const title = (rawTitle.replace(/^\d{2}\s+\w+\s+\d{4}\s*\([^)]+\)\s*:\s*/, '') || rawTitle)
        .replace(/</g, '&lt;').replace(/>/g, '&gt;');
      // Days relative label from published_at
      let timeLabel = '';
      if (ev.published_at) {
        const evDate = new Date(ev.published_at + 'T00:00:00Z');
        const nowDate = new Date();
        nowDate.setUTCHours(0, 0, 0, 0);
        const diffDays = Math.round((evDate - nowDate) / 86400000);
        if (diffDays === 0) timeLabel = 'today';
        else if (diffDays === 1) timeLabel = 'tmrw';
        else if (diffDays === -1) timeLabel = '1d ago';
        else if (diffDays > 0) timeLabel = `+${diffDays}d`;
        else timeLabel = `${Math.abs(diffDays)}d ago`;
      }
      html += `<div class="alert-item ${cls}">
        <div class="alert-badge">${lbl}</div>
        <div class="alert-info">
          <div class="alert-title">${title}</div>
        </div>
        ${timeLabel ? `<div class="alert-time-col">${timeLabel}</div>` : ''}
      </div>`;
    }
    list.innerHTML = html;
  }

  // ── News ────────────────────────────────────────────────
  async function loadNewsItems() {
    const list = document.getElementById('news-list');
    const badge = document.getElementById('news-badge');
    if (!list) return;

    let xmlText = null;
    try { xmlText = await fetch('/news/rss.xml').then(r => r.ok ? r.text() : null); } catch (_) {}

    if (!xmlText) {
      list.innerHTML = '<div class="alerts-empty">No news available.</div>';
      return;
    }

    const doc = new DOMParser().parseFromString(xmlText, 'application/xml');
    const itemEls = Array.from(doc.querySelectorAll('item')).slice(0, 20);
    if (!itemEls.length) {
      list.innerHTML = '<div class="alerts-empty">No news available.</div>';
      return;
    }
    if (badge) { badge.textContent = itemEls.length; badge.style.display = ''; }

    const CAT_LABEL = { SCIENCE: 'SCI', NEWS: 'NEWS', NEBULACAST: 'NBC', IMAGES: 'IMG', VIDEOS: 'VID' };
    const CAT_CLS   = { SCIENCE: 'news-science', NEWS: 'news-news', NEBULACAST: 'news-nebulacast', IMAGES: 'news-images', VIDEOS: 'news-videos' };

    let html = '';
    for (const el of itemEls) {
      const title = (el.querySelector('title')?.textContent || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const link  = el.querySelector('link')?.textContent || '';
      const cat   = (el.querySelector('category')?.textContent || '').trim().toUpperCase();
      const pubDate = el.querySelector('pubDate')?.textContent || '';
      const lbl = CAT_LABEL[cat] || cat.slice(0, 3) || 'NEWS';
      const cls = CAT_CLS[cat] || 'news-news';
      const time = pubDate ? fmtAge(new Date(pubDate).toISOString()) : '';
      html += `<div class="alert-item ${cls}">
        <div class="alert-badge">${lbl}</div>
        <div class="alert-info">
          <div class="alert-title">${link ? `<a href="${link}" target="_blank" rel="noopener noreferrer" style="color:inherit;text-decoration:none;">${title}</a>` : title}</div>
        </div>
        ${time ? `<div class="alert-time-col">${time}</div>` : ''}
      </div>`;
    }
    list.innerHTML = html;
  }

  // ── NOP interactive: profile & chart chip clicks ───────
  document.getElementById('console-hero').addEventListener('click', e => {
    const pb = e.target.closest('.nop-profile-btn');
    if (pb) {
      const p = pb.dataset.profile;
      _nopActiveProfile = p;
      // Update NQI display
      const nqi = _nopNQI[p] || {};
      const val = nqi.value != null ? nqi.value.toFixed(1) : '—';
      const cls = nqi.class || 'poor';
      const clr = _nqiColor(cls);
      const sv = document.getElementById('nop-nqi-val');
      const sl = document.getElementById('nop-nqi-lbl');
      const sa = document.getElementById('nop-nqi-avg');
      if (sv) { sv.textContent = val; sv.style.color = clr; }
      if (sl) { sl.textContent = _nqiLabel(cls); sl.style.color = clr; }
      if (sa) { const avg = _nopAvgScore[p]; sa.textContent = avg != null ? `avg ${avg}/100` : ''; }
      document.querySelectorAll('.nop-profile-btn').forEach(b => b.classList.toggle('is-active', b.dataset.profile === p));
      return;
    }
    const ch = e.target.closest('.nop-chip');
    if (ch) {
      _nopActiveMetric = ch.dataset.metric;
      _nopRenderChart(_nopActiveMetric);
      document.querySelectorAll('.nop-chip').forEach(c => c.classList.toggle('is-active', c.dataset.metric === _nopActiveMetric));
    }
  });

  // ── Boot ───────────────────────────────────────────────
  loadHero();
  loadFeed();
  loadSwxAlerts();
  loadSkyAlerts();
  loadCalendarEvents();
  loadNewsItems();

</script>
</body>
</html>
