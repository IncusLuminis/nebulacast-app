<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nebulacast</title>
  
  <!-- Base styles -->
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/widget_news.css">
  <link rel="stylesheet" href="/assets/css/widget_calendar.css">
  
  <!-- Weather widget styles -->
  <link rel="stylesheet" href="/weather/assets/weather.css">
  <link rel="stylesheet" href="/weather/widgets/location/location.css">
  <link rel="stylesheet" href="/weather/widgets/controls/controls.css">
  <link rel="stylesheet" href="/weather/widgets/weather/weather.css">
  <link rel="stylesheet" href="/weather/widgets/map/map.css">
  <link rel="stylesheet" href="/weather/widgets/sun_moon/sun_moon.css">
  <link rel="stylesheet" href="/weather/widgets/astro/astro.css">
  
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0e14;
      color: #fff;
    }

    /* Main layout */
    .nebulacast-layout {
      display: flex;
      min-height: 100vh;
    }

    /* Vertical sidebar */
    .nebulacast-sidebar {
      width: 60px;
      background: rgba(20, 24, 36, 0.95);
      border-right: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      padding: 12px 0;
      gap: 4px;
      flex-shrink: 0;
      position: fixed;
      left: 0;
      top: 0;
      height: 100vh;
      z-index: 100;
    }

    .nebulacast-tab {
      width: 44px;
      height: 44px;
      margin: 0 auto;
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.5);
      font-size: 24px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nebulacast-tab:hover {
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.8);
    }

    .nebulacast-tab.is-active {
      background: rgba(74, 111, 165, 0.2);
      color: #4a6fa5;
    }

    /* Main content area */
    .nebulacast-main {
      margin-left: 60px;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Top bar with location */
    .nebulacast-topbar {
      background: rgba(20, 24, 36, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 12px 20px;
      flex-shrink: 0;
    }

    /* Content panels */
    .nebulacast-content {
      flex: 1;
      overflow: auto;
      padding: 20px;
    }

    .nebulacast-panel {
      display: none;
    }

    .nebulacast-panel.is-active {
      display: block;
    }

    /* Weather/Map/Sun widgets need widget-container wrapper */
    .widget-container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Sky panel - full height and width like Map */
    #panel-sky {
      padding: 0;
      height: calc(100vh - 100px);
      max-width: none; /* Remove width restriction */
    }

    #panel-sky .widget-container {
      height: 100%;
      max-width: none;
    }

    #w-sky {
      height: 100%;
      background: #0a0e14;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }

    #skyMount {
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* Ensure sky-root stays contained */
    #skyMount .sky-root {
      position: relative !important;
      width: 100% !important;
      height: 100% !important;
      max-width: 100% !important;
      max-height: 100% !important;
      overflow: hidden !important;
    }

    /* Fullscreen mode */
    .sky-root:fullscreen,
    :fullscreen .sky-root {
      position: fixed !important;
      width: 100vw !important;
      height: 100vh !important;
      max-width: none !important;
      max-height: none !important;
      top: 0 !important;
      left: 0 !important;
      background: #000 !important;
      overflow: visible !important;
    }

    /* News/Calendar widgets */
    .widget-section {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Map iframe takes full height like Sky */
    #panel-map {
      height: calc(100vh - 100px);
      padding: 0;
      max-width: none; /* Remove width restriction */
    }

    .map-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <div class="nebulacast-layout">
    <!-- Left sidebar navigation -->
    <nav class="nebulacast-sidebar" role="tablist">
      <button type="button" class="nebulacast-tab" data-tab="calendar" title="Calendar">📅</button>
      <button type="button" class="nebulacast-tab is-active" data-tab="weather" title="Weather">☁️</button>
      <button type="button" class="nebulacast-tab" data-tab="map" title="Map">🗺️</button>
      <button type="button" class="nebulacast-tab" data-tab="sun" title="Sun">☀️</button>
      <button type="button" class="nebulacast-tab" data-tab="sky" title="Sky">🌌</button>
      <button type="button" class="nebulacast-tab" data-tab="news" title="News">📰</button>
      <button type="button" class="nebulacast-tab" data-tab="observer-weather" title="Observer Weather">🔭</button>
      <button type="button" class="nebulacast-tab" data-tab="space-weather" title="Space Weather">🌞</button>
    </nav>

    <!-- Main content -->
    <div class="nebulacast-main">
      <!-- Top bar with location widget -->
      <div class="nebulacast-topbar">
        <div id="w-location"></div>
      </div>

      <!-- Content panels -->
      <div class="nebulacast-content">
        <!-- Calendar panel -->
        <div id="panel-calendar" class="nebulacast-panel">
          <section class="widget-section">
            <div id="nrc-main" class="nrc-root">
              <div class="nrc-filters" data-role="filters"></div>
              <div class="nrc-header">
                <div class="nrc-meta">
                  <a class="nrc-link" href="/calendar/daily_signal.json" target="_blank" rel="noopener">JSON</a>
                  <a class="nrc-link" href="/alerts/rss.xml" target="_blank" rel="noopener">RSS</a>
                </div>
              </div>
              <div class="nrc-status" data-role="status">Loading...</div>
              <div class="nrc-list" data-role="list"></div>
            </div>
          </section>
        </div>

        <!-- Weather panel -->
        <div id="panel-weather" class="nebulacast-panel is-active">
          <div id="w-weather" class="widget-container"></div>
        </div>

        <!-- Map panel -->
        <div id="panel-map" class="nebulacast-panel">
          <iframe 
            id="mapIframe" 
            src="/weather/map-poc.html" 
            class="map-iframe"
            title="Weather Map"
            frameborder="0"
          ></iframe>
        </div>

        <!-- Sun panel -->
        <div id="panel-sun" class="nebulacast-panel">
          <div id="w-sun" class="widget-container"></div>
        </div>

        <!-- Sky panel -->
        <div id="panel-sky" class="nebulacast-panel">
          <div id="w-sky" class="widget-container">
            <div id="skyMount"></div>
          </div>
        </div>

        <!-- Observer Weather panel -->
        <div id="panel-observer-weather" class="nebulacast-panel">
          <div id="w-observer-weather" class="widget-container"></div>
        </div>

        <!-- Space Weather panel -->
        <div id="panel-space-weather" class="nebulacast-panel">
          <div id="w-helio" class="widget-container"></div>
        </div>

        <!-- News panel -->
        <div id="panel-news" class="nebulacast-panel">
          <section class="widget-section">
            <div id="nrw-main" class="nrw-root">
              <div class="nrw-filters" data-role="filters"></div>
              <div class="nrw-header">
                <div class="nrw-meta">
                  <a class="nrw-rss" href="/news/rss.xml" target="_blank" rel="noopener">RSS</a>
                </div>
              </div>
              <div class="nrw-status" data-role="status">Loading...</div>
              <div class="nrw-list" data-role="list"></div>
            </div>
          </section>
        </div>
      </div>
    </div>
  </div>

  <!-- Weather widget modals (required by weather.js) -->
  <!-- Bottom sheet modal (legacy parameter details) -->
  <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-sheet">
      <div class="modal-header">
        <h3 id="modal-title">Parameter Details</h3>
        <button class="modal-close" aria-label="Close">&times;</button>
      </div>
      <div class="modal-content" id="modal-content"></div>
    </div>
  </div>

  <!-- Factor tooltip (breakdown (i) icons) -->
  <div class="factor-tooltip" id="factorTooltip" role="tooltip" aria-hidden="true">
    <div class="factor-tooltip-title" id="factorTooltipTitle"></div>
    <div class="factor-tooltip-body" id="factorTooltipBody"></div>
  </div>

  <!-- Chip popover (L1 details) -->
  <div class="chip-overlay" id="chipOverlay" role="dialog" aria-modal="true" aria-labelledby="chipSheetTitle">
    <div class="chip-sheet" id="chipSheet">
      <div class="sheet-hdr">
        <h3 id="chipSheetTitle"></h3>
      </div>
      <div class="chip-sheet-body" id="chipSheetBody"></div>
    </div>
  </div>

  <!-- Chart overlay (mini-chart detail view) -->
  <div class="chart-overlay" id="chartOverlay" role="dialog" aria-modal="true" aria-labelledby="chartOverlayTitle" aria-hidden="true">
    <div class="chart-overlay-backdrop"></div>
    <div class="chart-overlay-panel">
      <div class="chart-overlay-header">
        <h3 id="chartOverlayTitle">Score</h3>
        <button class="chart-overlay-close" aria-label="Close">&times;</button>
      </div>
      <div class="chart-overlay-subheader" id="chartOverlaySubheader">
        Horizon: TONIGHT • Profile: Balanced • Updated: —
      </div>
      <div class="chart-overlay-canvas-wrapper">
        <canvas id="chartCanvas" width="800" height="300"></canvas>
        <div class="chart-tooltip" id="chartTooltip" aria-hidden="true"></div>
      </div>
      <div class="chart-overlay-footer">
        <div class="chart-stat">
          <span class="chart-stat-label">Now:</span>
          <span class="chart-stat-value" id="chartStatNow">—</span>
        </div>
        <div class="chart-stat">
          <span class="chart-stat-label">Min:</span>
          <span class="chart-stat-value" id="chartStatMin">—</span>
        </div>
        <div class="chart-stat">
          <span class="chart-stat-label">Max:</span>
          <span class="chart-stat-value" id="chartStatMax">—</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Hour Inspector bottom sheet -->
  <div class="hour-inspector-backdrop" id="hourInspectorBackdrop" aria-hidden="true"></div>
  <div class="hour-inspector-sheet" id="hourInspectorSheet" role="dialog" aria-modal="true" aria-labelledby="hourInspectorTitle" aria-hidden="true">
    <div class="hour-inspector-header" id="hourInspectorHeader">
      <div class="hour-inspector-header-left">
        <div class="hour-inspector-time" id="hourInspectorTime">—</div>
        <div class="hour-inspector-score-val" id="hourInspectorScoreVal">—</div>
        <div class="hour-inspector-score-label" id="hourInspectorScoreLabel">—</div>
        <div id="hourInspectorMoonLine" class="hour-inspector-moon-line"></div>
        <div id="hourInspectorScoreBar" class="hour-inspector-score-bar"><div class="hour-inspector-score-bar-fill"></div></div>
      </div>
      <div class="hour-inspector-header-right">
        <div class="hour-inspector-summary" id="hourInspectorSummary">—</div>
        <div id="hourInspectorChartSlot"></div>
      </div>
      <button class="hour-inspector-close" aria-label="Close">&times;</button>
    </div>
    <div class="hour-inspector-body" id="hourInspectorBody"></div>
  </div>

  <!-- Widget resize controls (dev tool) -->

  <!-- Sun/Moon calculations -->
  <script src="https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.js"></script>

  <!-- News/Calendar widgets -->
  <script src="/assets/js/widget_runtime.js"></script>
  <!-- Observer weather panel -->
  <script src="/assets/js/widget_observer_weather.js"></script>
  <!-- Helio widget (Space Weather) -->
  <script src="/helio/dist/helio.widget.js"></script>

  <!-- Weather app state and widgets -->
  <script type="module">
    import { initState, getState, setState, subscribe } from "/weather/core/state.js";
    import { mountLocation } from "/weather/widgets/location/location.js";
    import { mountWeather } from "/weather/widgets/weather/weather.js";
    import { mountSunMoon } from "/weather/widgets/sun_moon/sun_moon.js";

    // Initialize state
    initState();
    const storeApi = { getState, setState, subscribe };

    // Mount location widget (always visible in topbar)
    const locationEl = document.getElementById("w-location");
    if (locationEl) mountLocation(locationEl, storeApi);

    // Mount weather widgets
    const weatherEl = document.getElementById("w-weather");
    const sunEl = document.getElementById("w-sun");

    if (weatherEl) mountWeather(weatherEl, storeApi);
    if (sunEl) mountSunMoon(sunEl, storeApi);

    // Map is now loaded via iframe from /weather/map-poc.html
    // Listen for location changes and send to iframe
    const mapIframe = document.getElementById("mapIframe");
    if (mapIframe) {
      // When iframe loads, inject minimal CSS to make it fullwidth
      mapIframe.addEventListener('load', () => {
        try {
          const iframeDoc = mapIframe.contentDocument || mapIframe.contentWindow.document;
          const style = iframeDoc.createElement('style');
          style.textContent = `
            /* Remove width restriction, keep all structure intact */
            .page-wrap {
              max-width: none !important;
              width: 100% !important;
              padding: 12px !important;
            }
            
            /* Make map taller to use available space */
            #map {
              height: calc(100vh - 250px) !important;
            }
            
            /* Remove rounded corners for cleaner look */
            .card,
            .map-wrapper,
            #map {
              border-radius: 0 !important;
            }
          `;
          iframeDoc.head.appendChild(style);
        } catch (e) {
          console.warn('Could not inject CSS into map iframe:', e);
        }
      });
      
      subscribe(() => {
        const state = getState();
        const location = state?.location;
        if (location && mapIframe.contentWindow) {
          mapIframe.contentWindow.postMessage({
            type: "update-location",
            location: location
          }, "*");
        }
      });
    }

    // Observer weather panel
    const obsWeatherEl = document.getElementById('w-observer-weather');
    if (obsWeatherEl && window.runObserverWeatherPanel) {
      window.runObserverWeatherPanel(obsWeatherEl, { jsonUrl: '/data/observer_weather_now.json' });
    }
    // Helio widget (Space Weather) — pass observer location from app state
    const helioEl = document.getElementById('w-helio');
    if (helioEl && window.HelioWidget) {
      const _helioLoc = getState()?.location ?? {};
      window.HelioWidget.mount(helioEl, {
        dataUrl:      '/data/helio_now.json',
        lat:          typeof _helioLoc.lat === 'number' ? _helioLoc.lat : undefined,
        lon:          typeof _helioLoc.lon === 'number' ? _helioLoc.lon : undefined,
        locationName: _helioLoc.name  || undefined,
      });
    }

    window.runCalendarWidget({
      rootId: 'nrc-main',
      jsonUrl: '/calendar/daily_signal.json', 
      maxItems: 20, 
      filters: ["All", "METEORS", "ECLIPSES", "CONJUNCTIONS", "OCCULTATIONS", "COMETS"], 
      iconBase: '/assets/icons/alerts' 
    });

    window.runNewsWidget({ 
      rootId: 'nrw-main', 
      rssUrl: '/news/rss.xml', 
      maxItems: 12, 
      parseMax: 300, 
      filters: ["All", "News", "Science", "Videos", "Images", "Nebulacast"] 
    });

    // ------------------------------
    // SKY widget (lazy load)
    // ------------------------------
    let skyInited = false;

    function clampMs(t, a, b) { return Math.max(a, Math.min(b, t)); }

    function pickLatLonFromState(s) {
      const lat = s?.location?.lat ?? s?.loc?.lat ?? s?.coords?.lat ?? s?.geo?.lat ?? null;
      const lon = s?.location?.lon ?? s?.location?.lng ?? s?.loc?.lon ?? s?.loc?.lng ?? 
                  s?.coords?.lon ?? s?.coords?.lng ?? s?.geo?.lon ?? s?.geo?.lng ?? null;
      return {
        lat: (typeof lat === "number" && isFinite(lat)) ? lat : null,
        lon: (typeof lon === "number" && isFinite(lon)) ? lon : null
      };
    }

    function pickDatetimeISOFromState(s) {
      const v = s?.time?.datetimeISO ?? s?.time?.iso ?? s?.time?.selectedISO ?? 
                s?.controls?.datetimeISO ?? s?.controls?.iso ?? s?.selectedTimeISO ?? null;
      if (typeof v === "string" && v.trim()) return v.trim();
      return null;
    }

    async function initSkyIfNeeded() {
      if (skyInited) return;
      skyInited = true;

      // Load Sky CSS
      const css = document.createElement("link");
      css.rel = "stylesheet";
      css.href = "/sky/assets/sky.css";
      document.head.appendChild(css);

      const state = getState();
      const { lat, lon } = pickLatLonFromState(state);

      const now = Date.now();
      const max = now + 7 * 24 * 60 * 60 * 1000;

      let dtISO = pickDatetimeISOFromState(state);
      if (dtISO) {
        const t = Date.parse(dtISO);
        if (isFinite(t)) dtISO = new Date(clampMs(t, now, max)).toISOString();
        else dtISO = null;
      }

      window.SKY_CONFIG = {
        baseUrl: "/sky",
        mountId: "skyMount",
        lat: (lat != null ? lat : 52.2297),
        lon: (lon != null ? lon : 21.0122),
        datetimeISO: dtISO,
        options: {
          showSunMoon: true,
          showMilkyWay: true,
          showGridEq: true,
          showConstellations: true,
          showObjects: true,
          showAlerts: true
        }
      };

      await import("/sky/widget.js");

      setTimeout(() => {
        try { window.__skyWidget?.resize?.(); } catch (_) {}
      }, 0);
    }

    function syncSkyFromState() {
      if (!window.__skyWidget || typeof window.__skyWidget.update !== "function") return;

      const s = getState();
      const { lat, lon } = pickLatLonFromState(s);

      const now = Date.now();
      const max = now + 7 * 24 * 60 * 60 * 1000;

      let dtISO = pickDatetimeISOFromState(s);
      if (dtISO) {
        const t = Date.parse(dtISO);
        if (isFinite(t)) dtISO = new Date(clampMs(t, now, max)).toISOString();
        else dtISO = null;
      }

      const patch = {};
      if (lat != null) patch.lat = lat;
      if (lon != null) patch.lon = lon;
      patch.datetimeISO = dtISO;

      try { window.__skyWidget.update(patch); } catch (_) {}
    }

    subscribe(() => {
      if (!skyInited) return;
      syncSkyFromState();
    });

    // ------------------------------
    // Tab switching
    // ------------------------------
    const tabs = document.querySelectorAll('.nebulacast-tab');
    const panels = document.querySelectorAll('.nebulacast-panel');

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        const targetTab = tab.dataset.tab;

        // Lazy init Sky on first open
        if (targetTab === 'sky') {
          initSkyIfNeeded().then(() => {
            syncSkyFromState();
            setTimeout(() => {
              try { window.__skyWidget?.resize?.(); } catch (_) {}
            }, 100);
          });
        }

        // Update active tab
        tabs.forEach(t => t.classList.remove('is-active'));
        tab.classList.add('is-active');

        // Show/hide panels
        panels.forEach(panel => {
          const isTarget = panel.id === `panel-${targetTab}`;
          panel.classList.toggle('is-active', isTarget);
        });

        // Update page title
        const titles = {
          calendar: 'Calendar',
          weather: 'Weather',
          map: 'Map',
          sun: 'Sun',
          sky: 'Sky',
          news: 'News',
          'observer-weather': 'Observer Weather',
          'space-weather': 'Space Weather',
        };
        document.title = `Nebulacast — ${titles[targetTab] || 'Weather'}`;
      });
    });
  </script>

  <!-- Dev: resize controls + embed above each widget -->
  <script>
    (function () {
      const PRESETS = [320, 480, 768, 1024];
      const ORIGIN  = window.location.origin;

      // Map panel-id → { sel: CSS selector to resize, embed: fn(w,h,base) → code string }
      const PANELS = {
        'panel-calendar':         { sel: '#panel-calendar .widget-section',  embed: (w,h,b) => iframeEmbed('calendar', w, h, b) },
        'panel-weather':          { sel: '#w-weather',                        embed: (w,h,b) => iframeEmbed('weather', w, h, b) },
        'panel-map':              { sel: '#mapIframe',                        embed: (w,h,b) => iframeEmbed('map', w, h, b) },
        'panel-sun':              { sel: '#w-sun',                            embed: (w,h,b) => iframeEmbed('sun', w, h, b) },
        'panel-sky':              { sel: '#w-sky',                            embed: (w,h,b) => iframeEmbed('sky', w, h, b) },
        'panel-observer-weather': { sel: '#w-observer-weather',               embed: (w,h,b) => iframeEmbed('observer-weather', w, h, b) },
        'panel-space-weather':    { sel: '#w-helio', defaultW: 400,            embed: (w,h,b) => helioEmbed(w, h, b) },
        'panel-news':             { sel: '#panel-news .widget-section',       embed: (w,h,b) => iframeEmbed('news', w, h, b) },
      };

      function iframeEmbed(tab, w, h, base) {
        const wAttr = w || 800, hAttr = h || 600;
        return [
          `<iframe`,
          `  src="${base}/?tab=${tab}"`,
          `  width="${wAttr}"`,
          `  height="${hAttr}"`,
          `  style="border:none;border-radius:12px"`,
          `  loading="lazy"`,
          `></iframe>`,
        ].join('\n');
      }

      function helioEmbed(w, h, base) {
        const sizeAttr = w ? ` style="width:${w}px${h ? `;height:${h}px` : ''}"` : '';
        return [
          `<div id="helio-widget"${sizeAttr}></div>`,
          ``,
          `<script src="${base}/helio/dist/helio.widget.js"><\/script>`,
          `<script>`,
          `  HelioWidget.mount(document.getElementById('helio-widget'), {`,
          `    dataUrl: '${base}/data/helio_now.json',`,
          `  });`,
          `<\/script>`,
        ].join('\n');
      }

      // ── Embed modal ──────────────────────────────────────────────────────
      const modal = document.createElement('div');
      modal.id = 'embed-modal';
      modal.style.cssText = [
        'display:none', 'position:fixed', 'inset:0', 'z-index:9999',
        'background:rgba(0,0,0,.72)', 'align-items:center', 'justify-content:center',
      ].join(';');
      modal.innerHTML = `
        <div style="background:#1a1f2e;border:1px solid rgba(255,255,255,.15);border-radius:12px;
                    padding:24px;max-width:640px;width:92%;position:relative;box-shadow:0 8px 40px rgba(0,0,0,.6)">
          <button id="em-close" style="position:absolute;top:10px;right:14px;background:none;border:none;
                  color:rgba(255,255,255,.4);font-size:22px;cursor:pointer;line-height:1">&times;</button>
          <div style="font-size:11px;font-family:monospace;color:rgba(255,255,255,.4);margin-bottom:14px;letter-spacing:.05em">
            EMBED CODE
          </div>
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
            <label style="font-size:11px;font-family:monospace;color:rgba(255,255,255,.35);white-space:nowrap">Base URL</label>
            <input id="em-origin" type="text" spellcheck="false"
              style="flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
                border-radius:5px;color:rgba(255,255,255,.75);font-size:12px;font-family:monospace;
                padding:4px 9px;outline:none;min-width:0"
              placeholder="https://your-domain.com">
          </div>
          <textarea id="em-code" readonly style="width:100%;height:160px;background:rgba(0,0,0,.45);
            border:1px solid rgba(255,255,255,.1);border-radius:6px;color:#7ec8e3;
            font-family:monospace;font-size:12px;line-height:1.6;padding:12px;
            resize:vertical;outline:none;box-sizing:border-box"></textarea>
          <div style="display:flex;align-items:center;gap:10px;margin-top:12px">
            <button id="em-copy" style="padding:7px 20px;background:rgba(74,111,165,.35);
              border:1px solid rgba(74,111,165,.5);border-radius:6px;color:#fff;
              font-family:monospace;font-size:12px;cursor:pointer">
              Copy
            </button>
            <span id="em-copied" style="font-size:11px;font-family:monospace;color:#5cce8c;
              opacity:0;transition:opacity .3s">Copied!</span>
          </div>
        </div>`;
      document.body.appendChild(modal);

      const emCode   = modal.querySelector('#em-code');
      const emOrigin = modal.querySelector('#em-origin');
      const emCopy   = modal.querySelector('#em-copy');
      const emCopied = modal.querySelector('#em-copied');

      modal.querySelector('#em-close').addEventListener('click', () => {
        modal.style.display = 'none';
      });
      modal.addEventListener('click', e => {
        if (e.target === modal) modal.style.display = 'none';
      });
      emCopy.addEventListener('click', () => {
        navigator.clipboard.writeText(emCode.value).then(() => {
          emCopied.style.opacity = '1';
          setTimeout(() => { emCopied.style.opacity = '0'; }, 1800);
        });
      });

      let _embedFn = null;
      let _embedW = null, _embedH = null;

      emOrigin.addEventListener('input', () => {
        if (_embedFn) emCode.value = _embedFn(_embedW, _embedH, emOrigin.value.replace(/\/$/, '') || ORIGIN);
      });

      function openEmbed(fn, w, h) {
        _embedFn = fn; _embedW = w; _embedH = h;
        // Pre-fill Base URL: replace localhost with placeholder hint
        if (!emOrigin.value || emOrigin.value.startsWith('http://localhost')) {
          emOrigin.value = ORIGIN.startsWith('http://localhost') ? '' : ORIGIN;
          emOrigin.placeholder = ORIGIN.startsWith('http://localhost')
            ? 'https://your-domain.com  (localhost detected)'
            : ORIGIN;
        }
        const base = emOrigin.value.replace(/\/$/, '') || ORIGIN;
        emCode.value = fn(w, h, base);
        modal.style.display = 'flex';
        setTimeout(() => emCode.select(), 50);
      }

      // ── Per-panel bars ───────────────────────────────────────────────────
      Object.entries(PANELS).forEach(([panelId, { sel, embed, defaultW }]) => {
        const panel = document.getElementById(panelId);
        const target = panel && document.querySelector(sel);
        if (!panel || !target) return;

        const bar = document.createElement('div');
        bar.className = 'resize-bar';
        bar.innerHTML =
          '<label>W <input type="number" class="rz-w" placeholder="auto" min="100" step="10"></label>' +
          '<label>H <input type="number" class="rz-h" placeholder="auto" min="100" step="10"></label>' +
          '<button class="rz-reset">reset</button>' +
          '<span class="rz-presets">' +
            PRESETS.map(w => `<button class="rz-preset" data-w="${w}">${w}</button>`).join('') +
          '</span>' +
          '<button class="rz-embed">Embed</button>';

        const wIn = bar.querySelector('.rz-w');
        const hIn = bar.querySelector('.rz-h');

        function apply() {
          target.style.width    = wIn.value ? wIn.value + 'px' : '';
          target.style.maxWidth = wIn.value ? 'none' : '';
          target.style.height   = hIn.value ? hIn.value + 'px' : '';
        }

        if (defaultW) { wIn.value = defaultW; apply(); }

        wIn.addEventListener('input', apply);
        hIn.addEventListener('input', apply);

        bar.querySelector('.rz-reset').addEventListener('click', () => {
          wIn.value = ''; hIn.value = ''; apply();
        });

        bar.querySelectorAll('.rz-preset').forEach(btn => {
          btn.addEventListener('click', () => { wIn.value = btn.dataset.w; apply(); });
        });

        bar.querySelector('.rz-embed').addEventListener('click', () => {
          openEmbed(embed, wIn.value ? +wIn.value : null, hIn.value ? +hIn.value : null);
        });

        panel.insertBefore(bar, target);
      });
    })();
  </script>
</body>
</html>
