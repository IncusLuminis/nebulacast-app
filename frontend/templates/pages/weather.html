<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{SITE_TITLE}} — Weather</title>
  <link rel="stylesheet" href="{{BASE_PATH}}/assets/css/base.css">
  <link rel="stylesheet" href="{{BASE_PATH}}/assets/css/widget_weather_poc.css">
</head>
<body>
  <div class="page-wrap">
    <header class="page-header">
      <h1>{{SITE_TITLE}}</h1>
      <p class="subtitle">{{SITE_SUBTITLE}} · Weather</p>
    </header>
    <main>
      {{WIDGET_WEATHER_POC_HTML}}
      <p class="rss-link"><a href="{{BASE_PATH}}/weather/daily_weather.json">JSON</a></p>
    </main>
  </div>

  <!-- Bottom sheet modal (legacy parameter details) -->
  <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-sheet">
      <div class="modal-header">
        <h3 id="modal-title">Parameter Details</h3>
        <button class="modal-close" aria-label="Close">&times;</button>
      </div>
      <div class="modal-content" id="modal-content"></div>
    </div>
  </div>

  <!-- Factor tooltip (breakdown (i) icons) -->
  <div class="factor-tooltip" id="factorTooltip" role="tooltip" aria-hidden="true">
    <div class="factor-tooltip-title" id="factorTooltipTitle"></div>
    <div class="factor-tooltip-body" id="factorTooltipBody"></div>
  </div>

  <!-- Chip popover (L1 details) -->
  <div class="chip-overlay" id="chipOverlay" role="dialog" aria-modal="true" aria-labelledby="chipSheetTitle">
    <div class="chip-sheet" id="chipSheet">
      <div class="sheet-hdr">
        <h3 id="chipSheetTitle"></h3>
      </div>
      <div class="chip-sheet-body" id="chipSheetBody"></div>
    </div>
  </div>

  <script>
    window.__WEATHER_POC_CONFIG = {{WIDGET_WEATHER_POC_CONFIG_JSON}};
  </script>
  <script src="{{BASE_PATH}}/assets/js/widget_weather_poc.js"></script>
</body>
</html>
