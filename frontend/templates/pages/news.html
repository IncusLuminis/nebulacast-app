<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{SITE_TITLE}} — News</title>
  <link rel="stylesheet" href="{{BASE_PATH}}/assets/css/base.css">
  <link rel="stylesheet" href="{{BASE_PATH}}/assets/css/widget_news.css">
</head>
<body>
  <div class="page-wrap">
    <header class="page-header">
      <h1>{{SITE_TITLE}}</h1>
      <p class="subtitle">{{SITE_SUBTITLE}} · News</p>
    </header>
    <main>
      {{WIDGET_NEWS_HTML}}
      <p class="rss-link"><a href="{{BASE_PATH}}/news/rss.xml">RSS feed</a></p>
    </main>
  </div>
  <script src="{{BASE_PATH}}/assets/js/widget_runtime.js"></script>
  <script>
    (function() {
      var config = {{WIDGET_NEWS_CONFIG_JSON}};
      if (window.runNewsWidget) window.runNewsWidget(config);
    })();
  </script>
</body>
</html>
