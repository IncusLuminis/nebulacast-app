# Backend pipeline: sky objects. Writes to:
# - services/sky/data/generated/objects_today.json
# - services/sky/data/generated/objects_week.json
# - sites/staging/sky/data/objects_today.json
# - sites/staging/sky/data/objects_week.json
name: Cron — Sky Objects backend

on:
  schedule:
    # Twice daily (UTC): 00:00 and 12:00
    - cron: "0 0,12 * * *"
  workflow_dispatch:

concurrency:
  group: sky-objects-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sky-objects:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sky deps
        run: pip install -r services/sky/requirements.txt

      - name: Run sky objects pipeline
        run: |
          set -e
          PYTHONPATH=services/sky python services/sky/pipelines/gen_objects.py
          echo "Sky objects pipeline completed successfully"

      - name: Commit and push outputs
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add services/sky/data/generated/objects_today.json 2>/dev/null || true
          git add services/sky/data/generated/objects_week.json 2>/dev/null || true
          git add sites/staging/sky/data/objects_today.json 2>/dev/null || true
          git add sites/staging/sky/data/objects_week.json 2>/dev/null || true

          git diff --staged --quiet && exit 0

          git pull --rebase origin "${{ github.ref_name }}" 2>/dev/null || true
          git commit -m "chore(sky): update objects"
          git push