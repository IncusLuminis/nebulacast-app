name: Cron — Sky Alerts backend

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  sky-alerts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Sync branch (pre-run)
        run: |
          set -euxo pipefail
          git fetch origin "${{ github.ref_name }}"
          git pull --rebase origin "${{ github.ref_name }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Debug env
        run: |
          set -euxo pipefail
          pwd
          ls -la
          python -V
          pip -V
          ls -la services/sky || true
          ls -la services/sky/pipelines || true
          ls -la sites/staging/sky/data || true

      - name: Install sky deps
        run: |
          set -euxo pipefail
          pip install -r services/sky/requirements.txt

      - name: Run sky alerts backend
        run: |
          set -euxo pipefail
          PYTHONUNBUFFERED=1 PYTHONPATH=services/sky python -u services/sky/pipelines/gen_alerts.py
          ls -la sites/staging/sky/data/alerts_now.json

      - name: Commit and push outputs
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # stage outputs
          git add -A sites/staging/sky/data/alerts_now.json services/sky/data/generated/ 2>/dev/null || true
          git status --porcelain

          # no changes -> exit
          git diff --staged --quiet && exit 0

          # rebase safely even if something changed locally
          git pull --rebase --autostash origin "${{ github.ref_name }}"

          git commit -m "chore(sky-alerts): update alerts_now"
          git push origin "${{ github.ref_name }}"