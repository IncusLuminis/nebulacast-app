name: Cron — Sky Alerts backend

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

concurrency:
  group: sky-alerts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sky-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Sync branch (pre-run)
        run: |
          set -euxo pipefail
          git fetch origin "${{ github.ref_name }}"
          git pull --rebase origin "${{ github.ref_name }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/sky/requirements.txt

      - name: Install sky deps
        run: |
          set -euxo pipefail
          pip install -r services/sky/requirements.txt

      - name: Run sky alerts backend
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: "services/sky"
          NASA_CLIENT_ID: ${{ secrets.NASA_CLIENT_ID }}
          NASA_CLIENT_SECRET: ${{ secrets.NASA_CLIENT_SECRET }}
        run: |
          set -euxo pipefail
          python -u services/sky/pipelines/gen_gcn_alerts.py
          python -u services/sky/pipelines/gen_neo_alerts.py
          python -u services/sky/pipelines/gen_neocp_alerts.py
          python -u services/sky/pipelines/gen_risk_alerts.py
          python -u services/sky/pipelines/gen_alerts.py

          test -f services/sky/data/generated/alerts_now.json
          test -f sites/staging/sky/data/alerts_now.json

      - name: Commit and push outputs
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A \
            services/sky/data/generated/alerts_gcn.json \
            services/sky/data/generated/alerts_neo.json \
            services/sky/data/generated/alerts_neocp_tocp_grb.json \
            services/sky/data/generated/alerts_now.json \
            services/sky/data/generated/alerts_pha.json \
            services/sky/data/generated/alerts_risk.json \
            sites/staging/sky/data/alerts_gcn.json \
            sites/staging/sky/data/alerts_neo.json \
            sites/staging/sky/data/alerts_neocp_tocp_grb.json \
            sites/staging/sky/data/alerts_now.json \
            sites/staging/sky/data/alerts_pha.json \
            sites/staging/sky/data/alerts_risk.json

          # no changes -> exit
          git diff --staged --quiet && exit 0

          # rebase safely if remote moved
          git pull --rebase --autostash origin "${{ github.ref_name }}"

          git commit -m "chore(sky-alerts): update alerts datasets"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "${{ github.ref_name }}"