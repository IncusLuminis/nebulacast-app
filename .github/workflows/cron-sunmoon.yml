# Backend pipeline: sun+moon (offline DE421). Writes to:
# - services/sky/data/generated/sun_moon.json
# - sites/staging/sky/data/sun_moon.json
name: Cron — Sky Sun+Moon backend

on:
  schedule:
    # Twice daily (UTC): 00:00 and 12:00
    - cron: "10 2 * * *"
  workflow_dispatch:

concurrency:
  group: sky-sunmoon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sky-sunmoon:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Sync branch BEFORE generating anything
      - name: Sync branch
        run: |
          set -euxo pipefail
          git fetch origin "${{ github.ref_name }}"
          git pull --rebase origin "${{ github.ref_name }}"

      - name: Restore DE421 kernel from cache
        uses: actions/cache@v4
        with:
          path: services/sky/data/raw/de421.bsp
          key: de421-bsp-v1
          restore-keys: |
            de421-bsp-

      - name: Ensure DE421 kernel present
        run: |
          set -euxo pipefail
          mkdir -p services/sky/data/raw
          K=services/sky/data/raw/de421.bsp

          if [ ! -s "$K" ]; then
            echo "[sky] de421.bsp not found in cache; downloading from NAIF..."
            url="https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/a_old_versions/de421.bsp"
            curl -L --fail \
              --retry 6 --retry-delay 5 --retry-all-errors \
              --connect-timeout 20 --max-time 900 \
              -o "$K" \
              "$url"
          fi

          ls -lah "$K"
          test "$(stat -c%s "$K")" -gt 1000000

      - name: Install sky deps
        run: |
          set -euxo pipefail
          pip install -r services/sky/requirements.txt

      - name: Run sun+moon pipeline
        run: |
          set -euxo pipefail
          PYTHONUNBUFFERED=1 PYTHONPATH=services/sky \
          python -u services/sky/pipelines/gen_sunmoon.py

          ls -la sites/staging/sky/data/sun_moon.json
          ls -la services/sky/data/generated/sun_moon.json

      - name: Commit and push outputs
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A sites/staging/sky/data/sun_moon.json 2>/dev/null || true
          git add -A services/sky/data/generated/sun_moon.json 2>/dev/null || true

          git status --porcelain
          git diff --staged --quiet && exit 0

          git commit -m "chore(sky-sunmoon): update sun_moon"
          git push origin "${{ github.ref_name }}"