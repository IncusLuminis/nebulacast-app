name: Cron — Weather Map cloud pipeline

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours
  workflow_dispatch:

jobs:
  weather-map:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r services/weather/requirements.txt

      - name: Run weather map pipeline
        run: PYTHONPATH=services/weather python services/weather/pipelines/gen_weather_map.py

      - name: Validate output
        run: |
          python3 - <<'EOF'
          import json, sys
          d = json.load(open("sites/staging/data/weather_map_now.json"))
          required = ["schema_version", "updated_utc", "timeline", "layers", "playback"]
          for k in required:
              if k not in d:
                  print(f"FAIL: missing key '{k}'"); sys.exit(1)
          rendered = d["stats"]["rendered_frames"]
          if rendered < 50:
              print(f"FAIL: only {rendered} frames rendered (expected ≥50)"); sys.exit(1)
          # v1.1: validate profiles
          profiles = d["layers"]["clouds"].get("profiles", [])
          if profiles:
              if len(profiles) < 1:
                  print("FAIL: no profiles in layers.clouds.profiles"); sys.exit(1)
              for p in profiles:
                  for pk in ["id", "zoom_min", "zoom_max", "bounds", "frames"]:
                      if pk not in p:
                          print(f"FAIL: profile missing key '{pk}'"); sys.exit(1)
              n_frames = len(profiles[0]["frames"])
              for p in profiles[1:]:
                  if len(p["frames"]) != n_frames:
                      print(f"FAIL: profile {p['id']} frame count mismatch"); sys.exit(1)
              print(f"OK: {len(profiles)} profiles, {n_frames} frames each")
          print(f"OK: {rendered} total frames, updated {d['updated_utc']}")
          EOF

      # Commit only the JSON manifest to git (WebP files are .gitignored)
      - name: Commit manifest
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sites/staging/data/weather_map_now.json
          git diff --cached --quiet && echo "No changes to manifest" && exit 0
          git commit -m "data: weather map manifest $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin main
          git push

      # Deploy the full staging site (git files + generated WebP) to Cloudflare Pages.
      # This direct-upload deployment includes everything: static files from git checkout
      # + freshly generated cloud frames that are not committed to git.
      #
      # Required secrets (Settings → Secrets → Actions):
      #   CLOUDFLARE_API_TOKEN  — CF API token with Pages:Edit permission
      #   CLOUDFLARE_ACCOUNT_ID — CF account ID
      # Required variable (Settings → Variables → Actions):
      #   CF_PAGES_PROJECT      — Cloudflare Pages project name (e.g. "nebulacast-app")
      - name: Deploy to Cloudflare Pages (git files + generated frames)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            pages deploy sites/staging
            --project-name=${{ vars.CF_PAGES_PROJECT }}
            --branch=main
            --commit-dirty=true
