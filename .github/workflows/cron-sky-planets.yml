# Backend pipeline: sky planets. Writes to sites/staging/sky/data/planets.json
name: Cron — Sky Planets backend

on:
  schedule:
    # Daily at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: sky-planets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sky-planets:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # IMPORTANT: update branch BEFORE generating files
      - name: Sync branch
        run: |
          set -euxo pipefail
          git fetch origin "${{ github.ref_name }}"
          git pull --rebase origin "${{ github.ref_name }}"

      - name: Install sky deps
        run: |
          set -euxo pipefail
          pip install -r services/sky/requirements.txt

      # Download DE421 kernel (do NOT commit it)
      - name: Fetch DE421 kernel
        run: |
          set -euxo pipefail
          mkdir -p services/sky/data/raw
          K=services/sky/data/raw/de421.bsp
          if [ ! -s "$K" ]; then
            curl -L --fail --retry 5 --retry-delay 5 --connect-timeout 20 --max-time 600 \
              -o "$K" "https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de421.bsp"
          fi
          ls -lah "$K"

      - name: Run sky planets pipeline
        run: |
          set -euxo pipefail
          PYTHONUNBUFFERED=1 PYTHONPATH=services/sky python -u services/sky/pipelines/gen_planets.py
          ls -la sites/staging/sky/data/planets.json
          ls -la services/sky/data/generated/planets.json

      - name: Commit and push outputs
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # stage ONLY data outputs (never the kernel)
          git add -A sites/staging/sky/data/planets.json services/sky/data/generated/planets.json 2>/dev/null || true
          git status --porcelain

          git diff --staged --quiet && exit 0
          git commit -m "chore(sky-planets): update planets"
          git push origin "${{ github.ref_name }}"