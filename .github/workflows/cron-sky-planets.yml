# Backend pipeline: sky planets. Writes to sites/staging/sky/data/planets.json
name: Cron — Sky Planets backend

on:
  schedule:
    # Daily at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: sky-planets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sky-planets:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sky deps
        run: |
          set -euxo pipefail
          pip install -r services/sky/requirements.txt

      - name: Run sky planets pipeline
        run: |
          set -euxo pipefail
          PYTHONUNBUFFERED=1 PYTHONPATH=services/sky python -u services/sky/pipelines/gen_planets.py
          ls -la sites/staging/sky/data/planets.json

      - name: Commit and push outputs
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # 1) Update branch BEFORE staging/committing
          git fetch origin "${{ github.ref_name }}"
          git pull --rebase origin "${{ github.ref_name }}"

          # 2) Stage outputs (use -A to avoid unstaged surprises)
          git add -A sites/staging/sky/data/planets.json 2>/dev/null || true
          git add -A services/sky/data/generated/planets.json 2>/dev/null || true

          # Optional: show what's staged
          git status --porcelain

          # 3) No changes -> exit
          git diff --staged --quiet && exit 0

          # 4) Commit + push
          git commit -m "chore(sky-planets): update planets"
          git push origin "${{ github.ref_name }}"