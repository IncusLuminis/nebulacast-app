# Backend pipeline: sky planets. Writes to sites/staging/sky/data/planets.json
name: Cron — Sky Planets backend

on:
  schedule:
    # Daily at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: sky-planets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sky-planets:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sky deps
        run: pip install -r services/sky/requirements.txt

      - name: Run sky planets pipeline
        run: |
          set -e
          PYTHONPATH=services/sky python services/sky/pipelines/gen_planets.py
          echo "Sky planets pipeline completed successfully"

      - name: Commit and push outputs
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add sites/staging/sky/data/planets.json 2>/dev/null || true
          git diff --staged --quiet && exit 0

          git pull --rebase origin "${{ github.ref_name }}" 2>/dev/null || true
          git commit -m "chore(sky): update planets"
          git push