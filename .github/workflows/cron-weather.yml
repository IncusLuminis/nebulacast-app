# Backend pipeline: weather (Open-Meteo + 7Timer). Runs on schedule and writes to sites/staging/weather/.
name: Cron — Weather backend

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  weather-back:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install weather deps
        run: pip install -r services/weather/requirements.txt

      - name: Run weather backend
        run: PYTHONPATH=services/weather python services/weather/pipelines/run_weather.py

      - name: Commit and push outputs (data only; do not overwrite weather SPA)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sites/staging/weather/daily_weather.json 2>/dev/null || true
          git add sites/staging/data/weather/ 2>/dev/null || true
          git add services/weather/outputs/ 2>/dev/null || true
          git diff --staged --quiet && exit 0
          git pull --rebase origin "${{ github.ref_name }}" 2>/dev/null || true
          git commit -m "chore(weather): update backend outputs"
          git push
